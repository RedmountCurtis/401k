<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiduciary Monitor — 401(k) Plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#14213D; --ink-soft:#5B6472;
    --paper:#F5F3EE; --paper-raised:#FFFFFF;
    --line:#E1DDD1; --line-strong:#C9C4B4;
    --forest:#2F5233; --forest-soft:#E7EEE6;
    --amber:#9C6B18; --amber-soft:#F3EAD6;
    --brick:#8C2F2F; --brick-soft:#F3E2DF;
    --slate:#33506B; --slate-soft:#E7EDF1;
    --gold:#C9A25C;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', 'SF Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:var(--sans); background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; }
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{ width:250px; flex-shrink:0; background:var(--ink); color:#EDEEF2; padding:26px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand{ font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:0.01em; line-height:1.25; margin-bottom:2px; }
  .brand-sub{ font-size:10px; letter-spacing:0.13em; text-transform:uppercase; color:#8A93A8; margin-bottom:22px; font-weight:500; }

  .plan-select-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#8A93A8; font-weight:600; margin-bottom:7px; }
  .plan-select{ width:100%; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); color:#fff; font-family:var(--sans); font-size:13px; padding:9px 10px; border-radius:4px; margin-bottom:8px; }
  .plan-select option{ color:#111; }
  .plan-meta{ font-size:11px; color:#9BA3B5; line-height:1.6; margin-bottom:18px; }
  .link-row{ display:flex; gap:10px; margin-bottom:20px; }
  .link-row a, .link-row span{ font-size:11px; color:var(--gold); cursor:pointer; font-weight:600; }

  .nav-item{ display:flex; align-items:center; gap:10px; padding:9px 11px; margin-bottom:3px; border-radius:3px; font-size:13px; font-weight:500; cursor:pointer; color:#C4C9D6; transition:background .12s, color .12s; border-left:2px solid transparent; }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .nav-item.active{ background:rgba(255,255,255,0.09); color:#fff; border-left:2px solid var(--gold); }
  .nav-count{ margin-left:auto; font-family:var(--mono); font-size:10px; color:#8A93A8; background:rgba(255,255,255,0.08); padding:1px 6px; border-radius:8px; }
  .nav-divider{ height:1px; background:rgba(255,255,255,0.1); margin:14px 0; }
  .sidebar-foot{ margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,0.1); font-size:11px; color:#7E869B; line-height:1.6; }

  /* ---------- Main ---------- */
  .main{ flex:1; padding:34px 42px; max-width:1520px; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
  .page-title{ font-family:var(--serif); font-size:26px; font-weight:600; margin:0 0 4px; }
  .page-desc{ color:var(--ink-soft); font-size:13.5px; max-width:620px; }
  .btn{ font-family:var(--sans); font-size:12.5px; font-weight:600; cursor:pointer; padding:9px 16px; border-radius:3px; border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink); transition:all .12s; }
  .btn:hover{ border-color:var(--ink); }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .btn-primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .btn-primary:hover{ background:#233258; }
  .btn-ghost{ border-color:transparent; background:none; }
  .btn-ghost:hover{ background:var(--slate-soft); border-color:transparent; }
  .btn-sm{ padding:6px 11px; font-size:11.5px; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  input[type=file]{ display:none; }

  /* ---------- Table ---------- */
  .table-wrap{ background:var(--paper-raised); border:1px solid var(--line); border-radius:5px; overflow:hidden; overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); font-weight:600; padding:11px 14px; border-bottom:1px solid var(--line); background:#FAF9F5; white-space:nowrap; }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; transition:background .1s; }
  tbody tr:hover{ background:#FAF9F4; }
  .fund-name{ font-weight:600; font-size:13px; }
  .fund-cat{ color:var(--ink-soft); font-size:11px; }
  .mono{ font-family:var(--mono); }
  .num{ text-align:right; font-family:var(--mono); }
  .tag{ display:inline-block; font-size:10px; padding:2px 7px; border-radius:3px; background:var(--slate-soft); color:var(--slate); font-weight:600; }

  .status-pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:20px; font-size:10.5px; font-weight:600; letter-spacing:.02em; white-space:nowrap; }
  .status-pill::before{ content:''; width:6px; height:6px; border-radius:50%; }
  .status-green{ background:var(--forest-soft); color:var(--forest); }
  .status-green::before{ background:var(--forest); }
  .status-yellow{ background:var(--amber-soft); color:var(--amber); }
  .status-yellow::before{ background:var(--amber); }
  .status-red{ background:var(--brick-soft); color:var(--brick); }
  .status-red::before{ background:var(--brick); }

  .history-strip{ display:flex; gap:3px; }
  .history-dot{ width:9px; height:9px; border-radius:2px; }
  .history-dot.g{ background:var(--forest); } .history-dot.y{ background:var(--amber); } .history-dot.r{ background:var(--brick); } .history-dot.empty{ background:var(--line); }

  .empty-state{ padding:64px 30px; text-align:center; color:var(--ink-soft); }
  .empty-state h3{ font-family:var(--serif); color:var(--ink); font-size:18px; margin-bottom:6px; }
  .empty-state p{ font-size:13px; max-width:420px; margin:0 auto 18px; line-height:1.6; }

  /* ---------- Overview (all plans) ---------- */
  .plan-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:14px; }
  .plan-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:6px; padding:18px 20px; cursor:pointer; transition:border-color .12s; }
  .plan-card:hover{ border-color:var(--slate); }
  .plan-card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .plan-card h4{ font-family:var(--serif); font-size:16px; margin:0; }
  .plan-card .pc-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .plan-card .pc-stats{ display:flex; gap:14px; margin-top:14px; font-size:11.5px; color:var(--ink-soft); }
  .plan-card .pc-stats b{ color:var(--ink); font-family:var(--mono); }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(20,33,61,0.42); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; overflow-y:auto; }
  .modal{ background:var(--paper-raised); width:100%; max-width:780px; max-height:88vh; overflow-y:auto; border-radius:6px; box-shadow:0 20px 60px rgba(20,33,61,0.3); margin:auto; }
  .modal.wide{ max-width:920px; }
  .modal-head{ padding:22px 26px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; position:sticky; top:0; background:var(--paper-raised); z-index:2; }
  .modal-body{ padding:24px 26px; }
  .modal-close{ cursor:pointer; color:var(--ink-soft); font-size:20px; line-height:1; background:none; border:none; padding:2px; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .field-grid.cols3{ grid-template-columns:1fr 1fr 1fr; }
  .field-grid.cols4{ grid-template-columns:1fr 1fr 1fr 1fr; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }
  .field input, .field select, .field textarea{ font-family:var(--sans); font-size:13px; padding:8px 10px; border:1px solid var(--line-strong); border-radius:3px; background:var(--paper); color:var(--ink); }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--slate); }
  .field-note{ font-size:10.5px; color:var(--ink-soft); }
  .section-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--slate); margin:22px 0 12px; padding-top:18px; border-top:1px solid var(--line); }
  .section-label:first-child{ margin-top:0; padding-top:0; border-top:none; }

  /* ---------- Detail / seal ---------- */
  .detail-top{ display:flex; gap:24px; align-items:center; margin-bottom:22px; }
  .criteria-list{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .criteria-row{ display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); font-size:12px; background:var(--paper-raised); }
  .criteria-row:last-child{ border-bottom:none; }
  .criteria-row .c-label{ flex:1; font-weight:500; }
  .criteria-row .c-val{ font-family:var(--mono); color:var(--ink-soft); width:76px; text-align:right; }
  .criteria-row .c-pct{ font-family:var(--mono); width:44px; text-align:right; font-weight:600; }
  .bar-track{ width:70px; height:5px; background:var(--line); border-radius:3px; overflow:hidden; flex-shrink:0; }
  .bar-fill{ height:100%; }

  .callout{ padding:10px 14px; border-radius:4px; font-size:12px; line-height:1.55; margin-bottom:16px; }
  .callout-red{ background:var(--brick-soft); color:var(--brick); }
  .callout-amber{ background:var(--amber-soft); color:var(--amber); }
  .callout-slate{ background:var(--slate-soft); color:var(--slate); }

  /* ---------- IPS / Criteria page ---------- */
  .ips-row{ display:grid; grid-template-columns:1.6fr 100px 90px 130px 1.4fr; gap:12px; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .ips-row.head{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; }
  .ips-row input, .ips-row select{ font-family:var(--sans); font-size:12px; padding:6px 8px; border:1px solid var(--line-strong); border-radius:3px; width:100%; }
  .weight-total{ margin-top:14px; font-size:12.5px; }
  .weight-total.bad{ color:var(--brick); font-weight:600; }
  .weight-total.ok{ color:var(--forest); font-weight:600; }
  .card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:5px; padding:22px 24px; margin-bottom:18px; }
  .card h3{ font-family:var(--serif); font-size:16px; margin:0 0 4px; }
  .card .card-desc{ color:var(--ink-soft); font-size:12.5px; margin-bottom:16px; }

  /* ---------- TDF module ---------- */
  .tdf-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:6px; margin-bottom:16px; overflow:hidden; }
  .tdf-card-head{ padding:16px 20px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .tdf-card-head h3{ font-family:var(--serif); font-size:16px; margin:0; }
  .tdf-card-head .tdf-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .tdf-card-body{ padding:0 20px 20px; border-top:1px solid var(--line); }
  .vintage-table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:14px; }
  .vintage-table th{ text-align:right; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:7px 8px; border-bottom:1px solid var(--line); }
  .vintage-table th:first-child, .vintage-table td:first-child{ text-align:left; }
  .vintage-table td{ text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); font-family:var(--mono); }
  .vintage-table input{ width:100%; font-family:var(--mono); font-size:12px; padding:5px 6px; border:1px solid var(--line-strong); border-radius:3px; text-align:right; }
  .glide-flag{ font-size:11px; color:var(--brick); margin-top:8px; padding:8px 10px; background:var(--brick-soft); border-radius:4px; }

  /* ---------- Reports page ---------- */
  .report-fund-pick{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .chip{ padding:6px 12px; border:1px solid var(--line-strong); border-radius:20px; font-size:12px; cursor:pointer; background:var(--paper-raised); user-select:none; }
  .chip.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .report-doc{ background:var(--paper-raised); border:1px solid var(--line); border-radius:5px; }
  .report-page{ padding:46px 50px; border-bottom:8px solid var(--paper); }
  .report-page:last-child{ border-bottom:none; }
  .report-letterhead{ display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:18px; margin-bottom:26px; border-bottom:2px solid var(--ink); }
  .report-letterhead .rl-title{ font-family:var(--serif); font-size:22px; font-weight:600; }
  .report-letterhead .rl-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .report-letterhead .rl-meta{ text-align:right; font-size:11px; color:var(--ink-soft); line-height:1.7; }
  .report-fund-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:16px; }
  .report-fund-header h2{ font-family:var(--serif); font-size:19px; margin:0 0 2px; }
  .report-fund-header .rf-sub{ color:var(--ink-soft); font-size:12px; }
  .report-summary-line{ font-size:12.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:22px; padding:12px 14px; background:#FAF9F5; border-radius:4px; }
  .report-foot{ margin-top:30px; padding-top:14px; border-top:1px solid var(--line); font-size:10px; color:var(--ink-soft); line-height:1.7; }

  @media print{
    .sidebar, .page-head .btn-row, .no-print{ display:none !important; }
    .main{ padding:0; max-width:none; }
    body{ background:#fff; }
    .report-doc{ border:none; }
    .report-page{ border-bottom:none; page-break-after:always; padding:0; }
  }
  ::placeholder{ color:#A8A296; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   FIDUCIARY MONITOR — 401(k) plan fund scoring & due-diligence workspace
   Organized per plan. Each plan has its own fund menu, target-date fund
   evaluation, IPS criteria, and reports. No live data feed: figures are
   entered manually or via CSV import per plan. Stored locally per user.
   ========================================================================= */

const STORAGE_KEY = 'fiduciary-monitor-plans-v1';

/* ---------------------------- Supabase config --------------------------- */
const SUPABASE_URL = 'https://pdympbpyavilstjsmjtm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkeW1wYnB5YXZpbHN0anNtanRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODc1NjUsImV4cCI6MjEwMTM2MzU2NX0.zb-moqwGSoOB-rq9OSqk6cLt0JqXlzRBLebMLE2R4DA';
// Acts as a shared secret alongside the publishable key above — don't post this file's
// contents somewhere public, since anyone with both could read/write this workspace's data.
const WORKSPACE_ID = 'e830acee0705f0bfe1655c95';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DEFAULT_CRITERIA = [
  { key:'expenseRatio',    label:'Expense Ratio (%)',              direction:'lower',  weight:20, hard:false },
  { key:'managerTenure',   label:'Manager Tenure (yrs)',           direction:'higher', weight:7,  hard:true, hardMin:2 },
  { key:'alpha3y',         label:'3-Yr Alpha',                     direction:'higher', weight:9,  hard:false },
  { key:'sharpe3y',        label:'3-Yr Sharpe Ratio',               direction:'higher', weight:9,  hard:false },
  { key:'stdDev3y',        label:'3-Yr Std. Deviation',             direction:'lower',  weight:5,  hard:false },
  { key:'rSquared3y',      label:'3-Yr R-Squared',                  direction:'higher', weight:8,  hard:false },
  { key:'upCapture3y',     label:'Up-Market Capture',                direction:'higher', weight:6,  hard:false },
  { key:'downCapture3y',   label:'Down-Market Capture',              direction:'lower',  weight:6,  hard:false },
  { key:'return3y',        label:'3-Yr Return',                      direction:'higher', weight:6,  hard:false },
  { key:'return5y',        label:'5-Yr Return',                      direction:'higher', weight:6,  hard:false },
  { key:'excessReturn3y',  label:'3-Yr Excess Return vs. Benchmark',  direction:'higher', weight:12, hard:false, derived:true },
  { key:'revenueSharingBps', label:'Revenue Sharing (bps)',           direction:'lower',  weight:6,  hard:false },
];

const FIELD_META = {
  expenseRatio:{unit:'%', step:'0.01'}, managerTenure:{unit:'yrs', step:'0.5'},
  alpha3y:{unit:'', step:'0.01'}, sharpe3y:{unit:'', step:'0.01'},
  stdDev3y:{unit:'', step:'0.01'}, rSquared3y:{unit:'', step:'0.1'},
  upCapture3y:{unit:'%', step:'0.1'}, downCapture3y:{unit:'%', step:'0.1'},
  return3y:{unit:'%', step:'0.01'}, return5y:{unit:'%', step:'0.01'},
  aum:{unit:'$M', step:'1'}, benchmarkReturn3y:{unit:'%', step:'0.01'},
  revenueSharingBps:{unit:'bps', step:'1'}, excessReturn3y:{unit:'%', step:'0.01'},
  tdfVintageYear:{unit:'', step:'1'}, equityAllocation:{unit:'%', step:'0.1'},
  planAssetsHeld:{unit:'$', step:'1'},
};

// A holding is treated as a target-date fund whenever tdfSeries is set — either because
// the person filled in the TDF section directly, or because auto-detection below tagged it.
function isTdfHolding(h){ return !!(h.tdfSeries && h.tdfSeries.trim()); }

// Auto-detect target-date funds that were added as plain funds (e.g. category "Target-Date 2030")
// and weren't explicitly tagged, so CSV imports and manual adds both "just work" from one place.
function autoTagTdfHoldings(plan){
  plan.holdings.forEach(h=>{
    if(isTdfHolding(h)) return;
    if(!h.category || !/target-date/i.test(h.category)) return;
    const yearMatch = h.category.match(/(19|20)\d{2}/);
    h.tdfVintageYear = yearMatch ? Number(yearMatch[0]) : 2015; // nominal year for "Income"/no-year vintages
    h.tdfGlidePathType = h.tdfGlidePathType || 'to';
    if(h.name && h.name.trim()){
      // Derive a shared series name by stripping the vintage year and "Income"/"Fund" tokens from the
      // fund name, so "...2030 Fund" and "...Income Fund" both group under the same series.
      h.tdfSeries = h.name
        .replace(/\b(19|20)\d{2}\b/, '')
        .replace(/\bIncome\b/i, '')
        .replace(/\bFund\b/i, '')
        .replace(/\s+/g, ' ')
        .trim() || 'Target-Date Series';
    } else {
      // No fund name to work with — category alone can't distinguish providers, so bucket everything
      // together rather than accidentally splitting one series across "2030" vs "Retirement" variants.
      h.tdfSeries = 'Target-Date Series';
    }
  });
}

// One-time migration: fold the old separate plan.tdfSeries structure (from earlier versions of
// this tool) into plan.holdings so everything lives in one place going forward.
function migrateLegacyTdfSeries(plan){
  if(!plan.tdfSeries || !plan.tdfSeries.length) { plan.tdfSeries = undefined; return; }
  plan.tdfSeries.forEach(series=>{
    (series.vintages||[]).forEach(v=>{
      if(v.return3y==null && v.expenseRatio==null && v.equityAllocation==null) return; // drop empty placeholders
      plan.holdings.push({
        id: uid(), history:[],
        ticker:'', name:`${series.seriesName || 'Target-Date Series'} ${v.year}`,
        category:'Target-Date '+v.year, assetClass:'', shareClass:'',
        expenseRatio: v.expenseRatio ?? null, benchmarkIndex: series.benchmarkSeries || '',
        benchmarkReturn3y: v.benchmarkReturn3y ?? null, return3y: v.return3y ?? null, return5y: null,
        tdfSeries: series.seriesName || 'Target-Date Series', tdfVintageYear: v.year,
        tdfGlidePathType: series.glidePathType || 'to', equityAllocation: v.equityAllocation ?? null,
      });
    });
  });
  plan.tdfSeries = undefined;
}

const DEFAULT_IPS_NARRATIVE = {
  objectives: `This Investment Policy Statement ("IPS") establishes the framework for selecting, monitoring, and, when necessary, replacing the investment options made available under the Plan. The Plan's objective is to offer a diversified menu of investment options spanning the risk/return spectrum, enabling participants to construct portfolios consistent with their individual retirement savings goals, time horizons, and risk tolerances.`,
  roles: `The Plan Sponsor retains ultimate fiduciary responsibility for the Plan's investments. The Plan's investment advisor serves in an advisory capacity, providing investment recommendations, ongoing fund monitoring, and periodic reporting. The Plan Committee (or Plan Sponsor, where no committee is designated) is responsible for reviewing monitoring reports and making final investment decisions.`,
  watchProcedure: `Each investment option is reviewed no less than quarterly against the criteria set forth in this IPS. An investment option that fails to meet the Plan's criteria will be placed on a formal Watch List. An investment option remaining in Watch or Fail status for {{trigger}} consecutive quarterly reviews will be subject to formal review by the Plan Committee for probation or replacement.`,
  removalProcedure: `The Plan Committee may remove and replace any investment option at its discretion when it determines doing so is in the best interest of Plan participants — including, but not limited to, failure to meet the criteria in this IPS, material changes in fund management, strategy, or fees, or other regulatory concerns.`,
  adoptedDate: '',
};

function newPlan(name){
  return {
    id: uid(), name: name || 'New Plan', sponsor:'', recordkeeper:'', planType:'401(k)',

/* ---------------------------- scoring engine --------------------------- */
function percentileRank(value, allValues, direction){
  const vals = allValues.filter(v => typeof v === 'number' && !isNaN(v));
  if(vals.length <= 1) return 50;
  const sorted = [...vals].sort((a,b)=>a-b);
  let below = sorted.filter(v => v < value).length;
  let equal = sorted.filter(v => v === value).length;
  let rank = (below + 0.5*equal) / sorted.length;
  if(direction === 'lower') rank = 1 - rank;
  return Math.round(rank * 100);
}

function derivedValue(h, key){
  if(key === 'excessReturn3y'){
    if(typeof h.return3y==='number' && typeof h.benchmarkReturn3y==='number') return h.return3y - h.benchmarkReturn3y;
    return null;
  }
  return h[key];
}

// Broad asset-class fallback for peer grouping — used when a fund's exact category has too few
// in-menu peers to rank against fairly (e.g. one bond fund shouldn't be percentile-ranked on
// raw return against equity funds). Derived automatically from category text.
// Data completeness: what fraction of a fund's scorable numeric fields are actually filled in.
// Surfaces the "thin data" problem directly instead of letting it hide behind dashes in the table.
const COMPLETENESS_FIELDS = ['expenseRatio','managerTenure','alpha3y','sharpe3y','stdDev3y','rSquared3y',
  'upCapture3y','downCapture3y','return3y','return5y','benchmarkReturn3y','revenueSharingBps'];
function dataCompleteness(h){
  const filled = COMPLETENESS_FIELDS.filter(k=> typeof h[k]==='number' && !isNaN(h[k])).length;
  return { filled, total: COMPLETENESS_FIELDS.length, pct: Math.round(filled / COMPLETENESS_FIELDS.length * 100) };
}
// Same idea, scaled to what a target-date vintage actually has: equity allocation, expense ratio,
// return, and benchmark return — the fields the glide-path and excess-return checks depend on.
const TDF_COMPLETENESS_FIELDS = ['equityAllocation','expenseRatio','return3y','benchmarkReturn3y'];
function tdfDataCompleteness(h){
  const filled = TDF_COMPLETENESS_FIELDS.filter(k=> typeof h[k]==='number' && !isNaN(h[k])).length;
  return { filled, total: TDF_COMPLETENESS_FIELDS.length, pct: Math.round(filled / TDF_COMPLETENESS_FIELDS.length * 100) };
}

// Counts consecutive most-recent quarters a fund has NOT been in Pass status — the trigger
// most IPS watch-list procedures use to decide when a fund needs formal committee review.
function consecutiveWatchQuarters(history){
  if(!history || !history.length) return 0;
  const sorted = history.slice().sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  let count = 0;
  for(let i=sorted.length-1; i>=0; i--){
    if(sorted[i].status === 'green') break;
    count++;
  }
  return count;
}

function classifyAssetClass(category){
  const c = (category||'').toLowerCase();
  if(/bond|treasury|government|gilt|tips|yield|duration/.test(c)) return 'Fixed Income';
  if(/cash|money market|stable value/.test(c)) return 'Cash & Equivalents';
  if(/target-date|allocation|balanced/.test(c)) return 'Multi-Asset / Allocation';
  if(/real estate|commodit|gold|natural resources/.test(c)) return 'Real Assets';
  if(/value|growth|blend|cap|equity|foreign|emerging|international/.test(c)) return 'Equity';
  return 'Other';
}

function computeScores(holding, allHoldings, criteria, thresholds){
  const peers = allHoldings.filter(h => h.category === holding.category);
  const assetClassPeers = allHoldings.filter(h => classifyAssetClass(h.category) === classifyAssetClass(holding.category));
  let universe, tier;
  if(peers.length >= 3){ universe = peers; tier = 'category'; }
  else if(assetClassPeers.length >= 3){ universe = assetClassPeers; tier = 'assetClass'; }
  else { universe = allHoldings; tier = 'full'; }
  const breakdown = [];
  let hardFail = null;
  let weightedSum = 0, weightUsed = 0;

  criteria.forEach(c=>{
    const value = c.derived ? derivedValue(holding, c.key) : holding[c.key];
    if(c.hard && typeof value === 'number'){
      if(c.hardMin !== undefined && c.hardMin !== null && value < c.hardMin){
        hardFail = c.label + ' below IPS minimum (' + value + ' < ' + c.hardMin + ')';
      }
      if(c.hardMax !== undefined && c.hardMax !== null && value > c.hardMax){
        hardFail = c.label + ' above IPS maximum (' + value + ' > ' + c.hardMax + ')';
      }
    }
    if(typeof value !== 'number' || isNaN(value)){
      breakdown.push({ key:c.key, label:c.label, value:null, pct:null, weight:c.weight });
      return;
    }
    const allVals = universe.map(h => c.derived ? derivedValue(h, c.key) : h[c.key]);
    const pct = percentileRank(value, allVals, c.direction);
    breakdown.push({ key:c.key, label:c.label, value, pct, weight:c.weight });
    weightedSum += pct * c.weight;
    weightUsed += c.weight;
  });

  const overall = weightUsed > 0 ? Math.round(weightedSum / weightUsed) : 0;
  let status = 'red';
  if(!hardFail){
    if(overall >= thresholds.greenThreshold) status = 'green';
    else if(overall >= thresholds.yellowThreshold) status = 'yellow';
  }
  return { overall, status, breakdown, hardFail, peerCount: universe.length, peerTier: tier, usedFullUniverse: tier==='full' };
}

/* ---- Target-date fund evaluation (separate methodology) ---- */
function getTdfSeriesGroups(plan){
  const tdfHoldings = plan.holdings.filter(isTdfHolding);
  const names = [...new Set(tdfHoldings.map(h=>h.tdfSeries))];
  return names.map(seriesName=>{
    const holdings = tdfHoldings.filter(h=>h.tdfSeries===seriesName).sort((a,b)=>(a.tdfVintageYear||0)-(b.tdfVintageYear||0));
    return {
      seriesName,
      glidePathType: holdings.find(h=>h.tdfGlidePathType)?.tdfGlidePathType || 'to',
      benchmarkIndex: holdings.find(h=>h.benchmarkIndex)?.benchmarkIndex || '',
      holdings,
      vintages: holdings.map(h=>({ year:h.tdfVintageYear, equityAllocation:h.equityAllocation,
        expenseRatio:h.expenseRatio, return3y:h.return3y, benchmarkReturn3y:h.benchmarkReturn3y })),
    };
  });
}
function evaluateTdfSeries(series, tdfExpenseCap){
  const vintages = (series.vintages||[]).slice().sort((a,b)=>a.year-b.year);
  const withData = vintages.filter(v => typeof v.return3y==='number' && typeof v.benchmarkReturn3y==='number');
  const excessReturns = withData.map(v => v.return3y - v.benchmarkReturn3y);
  const avgExcess = excessReturns.length ? excessReturns.reduce((a,b)=>a+b,0)/excessReturns.length : null;
  const expenseVals = vintages.filter(v=>typeof v.expenseRatio==='number').map(v=>v.expenseRatio);
  const avgExpense = expenseVals.length ? expenseVals.reduce((a,b)=>a+b,0)/expenseVals.length : null;

  // glide path monotonicity: as target year increases (further from now), equity allocation should not decrease
  let glideFlag = null;
  const withEquity = vintages.filter(v=>typeof v.equityAllocation==='number');
  for(let i=1;i<withEquity.length;i++){
    if(withEquity[i].equityAllocation < withEquity[i-1].equityAllocation){
      glideFlag = `Glide path inversion: ${withEquity[i-1].year} vintage (${withEquity[i-1].equityAllocation}% equity) allocates more equity than the later ${withEquity[i].year} vintage (${withEquity[i].equityAllocation}% equity).`;
      break;
    }
  }

  let status = 'yellow';
  const reasons = [];
  const expenseCap = typeof tdfExpenseCap==='number' ? tdfExpenseCap : 0.5;
  const expenseOk = avgExpense===null ? null : avgExpense <= expenseCap;
  const excessOk = avgExcess===null ? null : avgExcess >= 0;

  if(glideFlag){ status='red'; reasons.push('Glide path inversion detected'); }
  else if(expenseOk===false && excessOk===false){ status='red'; reasons.push('Expense above cap and lagging benchmark'); }
  else if(expenseOk===true && excessOk===true){ status='green'; }
  else if(expenseOk===false || excessOk===false){ status='yellow'; if(expenseOk===false) reasons.push('Expense ratio above plan cap'); if(excessOk===false) reasons.push('Trailing benchmark on average'); }
  else { status='yellow'; reasons.push('Insufficient vintage data to fully evaluate'); }

  return { avgExcess, avgExpense, glideFlag, status, reasons, vintageCount: vintages.length, withDataCount: withData.length };
}

/* ------------------------------ helpers -------------------------------- */
function uid(){ return 'x_' + Math.random().toString(36).slice(2,10); }
function fmt(v, unit){
  if(v === null || v === undefined || v === '' || isNaN(v)) return '—';
  return (unit === '%' ? Number(v).toFixed(2)+'%' : unit === '$M' ? '$'+Number(v).toLocaleString()+'M' : unit === 'bps' ? Number(v).toFixed(0)+' bps' : Number(v).toFixed(2));
}
function statusLabel(s){ return s==='green'?'Pass':s==='yellow'?'Watch':'Fail'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function scoreColor(pct){ if(pct===null) return 'var(--line)'; if(pct>=60) return 'var(--forest)'; if(pct>=40) return 'var(--amber)'; return 'var(--brick)'; }

/* ---- Watchlist ---- */
function renderWatchlist(plan){
  const nonTdf = plan.holdings.filter(h=>!isTdfHolding(h));
  const tdfCount = plan.holdings.length - nonTdf.length;
  const selectedCount = nonTdf.filter(h=>ui.selectedFunds.has(h.id)).length;
  const allSelected = nonTdf.length>0 && selectedCount===nonTdf.length;
  const rows = nonTdf.map(h=>{
    const s = computeScores(h, nonTdf, plan.criteria, plan);
    const hist = (h.history||[]).slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
    const histTail = hist.slice(-8);
    const histDots = Array.from({length:8}).map((_,i)=>{
      const rec = histTail[i];
      if(!rec) return '<span class="history-dot empty"></span>';
      const cls = rec.status==='green'?'g':rec.status==='yellow'?'y':'r';
      return `<span class="history-dot ${cls}" title="${rec.date}: ${rec.overall}/100"></span>`;
    }).join('');
    const lastReviewLabel = hist.length ? `<div style="font-size:10px;color:var(--ink-soft);margin-top:3px;">Last: ${hist[hist.length-1].date}</div>` : `<div style="font-size:10px;color:var(--ink-soft);margin-top:3px;">Not yet reviewed</div>`;
    const streak = consecutiveWatchQuarters(h.history);
    const streakBadge = streak>=2 ? `<div style="font-size:10px;color:${streak>=plan.watchQuarterTrigger?'var(--brick)':'var(--amber)'};margin-top:3px;font-weight:600;">${streak} qtr${streak>1?'s':''} ${streak>=plan.watchQuarterTrigger?'— review trigger':'running'}</div>` : '';
    return `
    <tr data-detail="${h.id}">
      <td style="width:1%;" data-no-detail><input type="checkbox" class="fund-select" data-select-fund="${h.id}" ${ui.selectedFunds.has(h.id)?'checked':''}></td>
      <td>
        <div class="fund-name">${escapeHtml(h.ticker)} — ${escapeHtml(h.name)}</div>
        <div class="fund-cat">${escapeHtml(h.category||'Uncategorized')} ${h.shareClass ? '· <span class="tag">'+escapeHtml(h.shareClass)+'</span>' : ''} ${plan.qdiaType==='fund'&&plan.qdiaKey===h.id?'· <span class="tag" style="background:var(--slate-soft);color:var(--slate);">QDIA</span>':''}</div>

      <td><span class="status-pill status-${s.status}">${statusLabel(s.status)}</span></td>
      <td class="num">${s.overall}<span style="color:var(--ink-soft)">/100</span></td>
      <td class="num">${fmt(h.expenseRatio,'%')}</td>
      <td class="num">${fmt(h.revenueSharingBps,'bps')}</td>
      <td class="num">${fmt(derivedValue(h,'excessReturn3y'),'%')}</td>
      <td class="num" style="color:${dataCompleteness(h).pct<40?'var(--brick)':dataCompleteness(h).pct<75?'var(--amber)':'var(--ink-soft)'};">${dataCompleteness(h).filled}/${dataCompleteness(h).total}</td>
      <td><div class="history-strip">${histDots}</div>${lastReviewLabel}${streakBadge}</td>
      <td style="text-align:right;white-space:nowrap;" data-no-detail>
        <button class="btn btn-ghost btn-sm" data-replace="${h.id}">Replace</button>
        <button class="btn btn-ghost btn-sm" data-edit="${h.id}">Edit</button>
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="page-head">
    <div>
      <h1 class="page-title">Fund Menu — ${escapeHtml(plan.name)}</h1>
      <p class="page-desc">Add every fund in the plan's lineup here, including target-date funds — fill in "Target-Date Series" on a fund and it's automatically evaluated on the Target-Date Funds page instead of scored here. ${tdfCount>0 ? tdfCount+' fund(s) in this menu are routed there now.' : ''}</p>
    </div>
    <div class="btn-row">
      ${selectedCount>0 ? `<button class="btn" id="btn-delete-selected" style="color:var(--brick);border-color:var(--brick-soft);">Delete Selected (${selectedCount})</button>` : ''}
      ${nonTdf.length ? `<button class="btn" id="btn-run-review">Run Quarterly Review</button>` : ''}
      ${nonTdf.some(h=>(h.history||[]).length) ? `<button class="btn" id="btn-clear-history">Clear Review History</button>` : ''}
      ${nonTdf.length ? `<button class="btn" id="btn-pull-library" title="Fill blank fields from the Fund Library">Sync from Library</button>` : ''}
      ${nonTdf.length ? `<button class="btn" id="btn-push-library" title="Contribute this plan's data to the Fund Library">Save to Library</button>` : ''}

/* ---- Fund detail / seal ---- */
function renderSeal(overall, status, size){
  size = size || 116;
  const color = status==='green'?'var(--forest)':status==='yellow'?'var(--amber)':'var(--brick)';
  const r = size*0.4, c = 2*Math.PI*r, cx=size/2, cy=size/2;
  const pct = Math.max(0,Math.min(100,overall))/100;
  const dash = c*pct;
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="7"
      stroke-dasharray="${dash} ${c}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="'Source Serif 4',serif" font-size="${size*0.22}" font-weight="600" fill="var(--ink)">${overall}</text>
    <text x="${cx}" y="${cy+size*0.135}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="${size*0.078}" letter-spacing="1" fill="var(--ink-soft)">SCORE /100</text>
  </svg>`;
}

// Small inline line chart of composite score over logged quarterly reviews, with dashed reference
// lines at the plan's Pass/Watch thresholds so a reader can see at a glance which side of the line
// each quarter landed on.
function renderScoreTrendChart(history, plan){
  const hist = (history||[]).slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  if(hist.length < 2) return `<div class="field-note">Not enough logged reviews yet for a trend line — needs at least two quarters.</div>`;
  const w = 620, h = 150, padL = 28, padR = 12, padT = 12, padB = 22;
  const plotW = w-padL-padR, plotH = h-padT-padB, n = hist.length;
  const x = i => padL + (n===1?0:(i/(n-1))*plotW);
  const y = v => padT + plotH - (Math.max(0,Math.min(100,v))/100)*plotH;
  const points = hist.map((r,i)=>`${x(i).toFixed(1)},${y(r.overall).toFixed(1)}`).join(' ');
  const dots = hist.map((r,i)=>{
    const color = r.status==='green'?'var(--forest)':r.status==='yellow'?'var(--amber)':'var(--brick)';
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(r.overall).toFixed(1)}" r="4" fill="${color}"><title>${r.date}: ${r.overall}/100</title></circle>`;
  }).join('');
  const showEvery = n>8 ? Math.ceil(n/6) : 1;
  const labels = hist.map((r,i)=> (i%showEvery===0 || i===n-1) ? `<text x="${x(i).toFixed(1)}" y="${h-6}" font-size="9" fill="var(--ink-soft)" text-anchor="middle" font-family="'IBM Plex Mono',monospace">${escapeHtml(r.date.slice(2))}</text>` : '').join('');
  const greenY = y(plan.greenThreshold).toFixed(1), yellowY = y(plan.yellowThreshold).toFixed(1);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;display:block;">
    <line x1="${padL}" y1="${greenY}" x2="${w-padR}" y2="${greenY}" stroke="var(--forest)" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
    <line x1="${padL}" y1="${yellowY}" x2="${w-padR}" y2="${yellowY}" stroke="var(--amber)" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
    <polyline points="${points}" fill="none" stroke="var(--slate)" stroke-width="1.5"/>
    ${dots}
    ${labels}
  </svg>`;
}

/* ---- Fee Analyzer ---- */
// Falls back to the sum of entered fund balances when Plan Assets isn't filled in on Plan
// Details — often more accurate anyway, since it's real balance data rather than a rounded estimate.
function feeAssetsDollars(plan){
  if(typeof plan.planAssets==='number') return plan.planAssets*1e6;
  const sum = (plan.holdings||[]).filter(h=>typeof h.planAssetsHeld==='number' && h.planAssetsHeld>0)
    .reduce((s,h)=>s+h.planAssetsHeld,0);
  return sum>0 ? sum : null;
}
function feeToBps(plan, amt, type){
  if(amt==null) return null;
  if(type==='bps') return amt;
  if(type==='perParticipant'){
    const assets = feeAssetsDollars(plan);
    if(!assets || !plan.participantCount) return null;
    return (amt * plan.participantCount) / assets * 10000;
  }
  if(type==='flat'){
    const assets = feeAssetsDollars(plan);
    return assets ? (amt/assets)*10000 : null;
  }
  return null;
}
function feeToDollars(plan, amt, type){
  if(amt==null) return null;
  if(type==='perParticipant') return plan.participantCount ? amt*plan.participantCount : null;
  if(type==='bps'){ const assets = feeAssetsDollars(plan); return assets ? amt/10000*assets : null; }
  if(type==='flat') return amt;
  return null;
}
// Shared with renderFees so a logged snapshot always matches what's on screen at the time.
function computeFeeSnapshot(plan){
  const f = plan.fees;
  const allHoldings = plan.holdings;
  const fundsWithBoth = allHoldings.filter(h=>typeof h.expenseRatio==='number' && typeof h.planAssetsHeld==='number' && h.planAssetsHeld>0);
  const weightedAssetBase = fundsWithBoth.reduce((s,h)=>s+h.planAssetsHeld,0);
  const weightedExpenseRatio = weightedAssetBase>0 ? fundsWithBoth.reduce((s,h)=>s+h.expenseRatio*h.planAssetsHeld,0)/weightedAssetBase : null;
  const erValsFallback = allHoldings.map(h=>h.expenseRatio).filter(v=>typeof v==='number');
  const simpleAvgExpenseRatio = erValsFallback.length ? erValsFallback.reduce((a,b)=>a+b,0)/erValsFallback.length : null;
  const investmentBps = weightedExpenseRatio!==null ? weightedExpenseRatio*100 : (simpleAvgExpenseRatio!==null ? simpleAvgExpenseRatio*100 : null);

  const rkBps = feeToBps(plan, f.recordkeepingAmt, f.recordkeepingType);
  const advBps = feeToBps(plan, f.advisorAmt, f.advisorType);
  const rkDollars = feeToDollars(plan, f.recordkeepingAmt, f.recordkeepingType);
  const otherDollarsForBps = feeAssetsDollars(plan) && f.otherAmt!=null ? (f.otherAmt/feeAssetsDollars(plan))*10000 : null;

  const revenueSharingHoldings = allHoldings.filter(h=>typeof h.revenueSharingBps==='number' && h.revenueSharingBps>0 && typeof h.planAssetsHeld==='number' && h.planAssetsHeld>0);
  const revenueSharingDollars = revenueSharingHoldings.reduce((s,h)=>s+(h.revenueSharingBps/10000*h.planAssetsHeld),0);
  const revenueSharingBpsTotal = feeAssetsDollars(plan) && revenueSharingDollars>0 ? (revenueSharingDollars/feeAssetsDollars(plan))*10000 : null;
  let rkBpsNet = rkBps;
  if(f.revenueSharingTreatment==='offsetRecordkeeping' && revenueSharingDollars>0 && rkBps!=null && revenueSharingBpsTotal!=null){
    rkBpsNet = Math.max(0, rkBps - revenueSharingBpsTotal);
  }

  const totalBps = [rkBpsNet, advBps, investmentBps, otherDollarsForBps].every(v=>v===null) ? null :
    (rkBpsNet||0) + (advBps||0) + (investmentBps||0) + (otherDollarsForBps||0);
  const totalDollars = feeAssetsDollars(plan) && totalBps!==null ? totalBps/10000*feeAssetsDollars(plan) : null;
  const perParticipant = totalDollars && plan.participantCount ? totalDollars/plan.participantCount : null;
  const perEligible = totalDollars && plan.eligibleEmployeeCount ? totalDollars/plan.eligibleEmployeeCount : null;

  return { totalBps, totalDollars, perParticipant, perEligible, rkBps: rkBpsNet, advBps, investmentBps, otherBps: otherDollarsForBps,
    planAssetsDollars: feeAssetsDollars(plan) };
}

  return `

function renderFees(plan){
  const f = plan.fees;
  const allHoldings = plan.holdings;
  const withAssets = allHoldings.filter(h=>typeof h.planAssetsHeld==='number' && h.planAssetsHeld>0);
  const totalFundAssets = withAssets.reduce((s,h)=>s+h.planAssetsHeld,0);
  const fundsWithBoth = allHoldings.filter(h=>typeof h.expenseRatio==='number' && typeof h.planAssetsHeld==='number' && h.planAssetsHeld>0);
  const weightedAssetBase = fundsWithBoth.reduce((s,h)=>s+h.planAssetsHeld,0);
  const weightedExpenseRatio = weightedAssetBase>0 ? fundsWithBoth.reduce((s,h)=>s+h.expenseRatio*h.planAssetsHeld,0)/weightedAssetBase : null;
  const erValsFallback = allHoldings.map(h=>h.expenseRatio).filter(v=>typeof v==='number');
  const simpleAvgExpenseRatio = erValsFallback.length ? erValsFallback.reduce((a,b)=>a+b,0)/erValsFallback.length : null;
  const usingWeighted = weightedExpenseRatio !== null;
  const investmentBps = usingWeighted ? weightedExpenseRatio*100 : (simpleAvgExpenseRatio!==null ? simpleAvgExpenseRatio*100 : null);

  const statedPlanAssets = feeAssetsDollars(plan);
  let assetCheckNote = null;
  if(totalFundAssets>0 && statedPlanAssets){
    const diff = totalFundAssets - statedPlanAssets;
    const pctDiff = Math.abs(diff)/statedPlanAssets*100;
    assetCheckNote = Math.abs(diff) < 1000 ? 'Matches Plan Assets set in Plan Details.'
      : `${diff>0?'$'+Math.round(diff).toLocaleString()+' more':'$'+Math.round(Math.abs(diff)).toLocaleString()+' less'} than the $${plan.planAssets}M Plan Assets figure in Plan Details (${pctDiff.toFixed(0)}% difference) — worth reconciling, or some funds still need balances entered.`;
  }

  const rkBps = feeToBps(plan, f.recordkeepingAmt, f.recordkeepingType);
  const advBps = feeToBps(plan, f.advisorAmt, f.advisorType);
  const otherDollarsForBps = feeAssetsDollars(plan) && f.otherAmt!=null ? (f.otherAmt/feeAssetsDollars(plan))*10000 : null;
  const rkDollars = feeToDollars(plan, f.recordkeepingAmt, f.recordkeepingType);
  const advDollars = feeToDollars(plan, f.advisorAmt, f.advisorType);

  // Revenue sharing offset — revenue sharing is compensation already embedded inside a fund's
  // expense ratio and redirected to the recordkeeper; it is not an extra cost on top of the
  // investment-expense line above. What varies is what happens to it once collected.
  const revenueSharingHoldings = allHoldings.filter(h=>typeof h.revenueSharingBps==='number' && h.revenueSharingBps>0 && typeof h.planAssetsHeld==='number' && h.planAssetsHeld>0);
  const revenueSharingDollars = revenueSharingHoldings.reduce((s,h)=>s+(h.revenueSharingBps/10000*h.planAssetsHeld),0);
  const revenueSharingBpsTotal = feeAssetsDollars(plan) && revenueSharingDollars>0 ? (revenueSharingDollars/feeAssetsDollars(plan))*10000 : null;
  const treatment = f.revenueSharingTreatment||'';
  let rkBpsNet = rkBps, rkDollarsNet = rkDollars;
  if(treatment==='offsetRecordkeeping' && revenueSharingDollars>0){
    if(rkDollars!=null) rkDollarsNet = Math.max(0, rkDollars - revenueSharingDollars);
    if(rkBps!=null && revenueSharingBpsTotal!=null) rkBpsNet = Math.max(0, rkBps - revenueSharingBpsTotal);
  }
  const revenueSharingExceedsRk = treatment==='offsetRecordkeeping' && revenueSharingDollars>0 && rkDollars!=null && revenueSharingDollars > rkDollars;

  const totalBps = [rkBpsNet, advBps, investmentBps, otherDollarsForBps].every(v=>v===null) ? null :
    (rkBpsNet||0) + (advBps||0) + (investmentBps||0) + (otherDollarsForBps||0);
  const totalDollars = feeAssetsDollars(plan) && totalBps!==null ? totalBps/10000*feeAssetsDollars(plan) : null;
  const perParticipantTotal = totalDollars && plan.participantCount ? totalDollars/plan.participantCount : null;
  const perEligibleTotal = totalDollars && plan.eligibleEmployeeCount ? totalDollars/plan.eligibleEmployeeCount : null;
  const allInFlatBps = feeAssetsDollars(plan) && f.allInFlatAmt!=null ? (f.allInFlatAmt/feeAssetsDollars(plan))*10000 : null;
  let flatCheckNote = null;
  if(f.allInFlatAmt!=null && totalDollars!=null){
    const diff = f.allInFlatAmt - totalDollars;
    const pctDiff = totalDollars ? Math.abs(diff)/totalDollars*100 : null;
    flatCheckNote = Math.abs(diff) < 1 ? 'Matches the itemized total.'
      : `${diff>0?'$'+Math.round(diff).toLocaleString()+' higher':'$'+Math.round(Math.abs(diff)).toLocaleString()+' lower'} than the itemized total${pctDiff!==null?' ('+pctDiff.toFixed(0)+'% difference)':''} — worth reconciling which figure is more current.`;
  }

  // Payment source split — investment expenses are always netted from participant fund returns
  // by definition (an expense ratio isn't billed separately), so only rk/advisor/other are selectable.
  const investmentDollars = feeAssetsDollars(plan) && investmentBps!==null ? investmentBps/10000*feeAssetsDollars(plan) : null;
  let billedDollars = 0, nettedDollars = investmentDollars||0, splitDollars = 0;
  [[rkDollarsNet, f.recordkeepingSource||'employer'], [advDollars, f.advisorSource||'employer'], [f.otherAmt, f.otherSource||'employer']].forEach(([amt,src])=>{
    if(amt==null) return;
    if(src==='employer') billedDollars += amt;
    else if(src==='participant') nettedDollars += amt;
    else splitDollars += amt;
  });
  const hasPaymentData = billedDollars>0 || nettedDollars>0 || splitDollars>0;

  let reasonableness = null;
  const comparisonBps = totalBps!==null ? totalBps : allInFlatBps;
  const comparisonSource = totalBps!==null ? 'itemized total' : 'flat total';
  if(f.benchmarkLowBps!=null && f.benchmarkHighBps!=null && comparisonBps!==null){
    if(comparisonBps < f.benchmarkLowBps) reasonableness = {label:'Below benchmarked range', cls:'green', note:`Favorable, based on the ${comparisonSource} — but confirm the comparison used similar plan size and services.`};
    else if(comparisonBps > f.benchmarkHighBps) reasonableness = {label:'Above benchmarked range', cls:'red', note:`Based on the ${comparisonSource} — worth documenting the rationale (service level, plan complexity) or requesting updated bids.`};
    else reasonableness = {label:'Within benchmarked range', cls:'green', note:`Consistent with the comparison data on file, based on the ${comparisonSource}.`};
  }

  const sourceSelect = (id, val) => `<select id="${id}">
    <option value="employer" ${val==='employer'?'selected':''}>Billed to Employer</option>
    <option value="participant" ${val==='participant'?'selected':''}>Netted from Participants</option>
    <option value="split" ${val==='split'?'selected':''}>Split / Other Arrangement</option>
  </select>`;

  const assetRows = allHoldings.map(h=>`
    <tr>
      <td>${escapeHtml(h.ticker||h.name)}${isTdfHolding(h)?' <span class="tag">TDF '+h.tdfVintageYear+'</span>':''}</td>
      <td style="text-align:right;"><input type="number" step="1" data-asset-fund="${h.id}" value="${h.planAssetsHeld??''}" style="width:120px;text-align:right;font-family:var(--mono);"></td>
      <td class="num">${typeof h.planAssetsHeld==='number' && totalFundAssets>0 ? (h.planAssetsHeld/totalFundAssets*100).toFixed(1)+'%' : '—'}</td>
    </tr>`).join('');

  const genDate = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

  // Fee history trend
  const feeHist = (plan.feeHistory||[]).slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  let feeTrendNote = null;
  if(feeHist.length>=2){
    const first = feeHist[0], last = feeHist[feeHist.length-1];
    if(first.totalBps!=null && last.totalBps!=null){
      const bpsDiff = last.totalBps - first.totalBps;
      feeTrendNote = `${Math.abs(bpsDiff)<1?'Flat':bpsDiff<0?'Down '+Math.abs(bpsDiff).toFixed(1)+' bps':'Up '+bpsDiff.toFixed(1)+' bps'} since ${first.date}${last.planAssetsDollars && first.planAssetsDollars && last.planAssetsDollars>first.planAssetsDollars ? ' — plan assets have grown over that period, so cost should generally be trending down, not up.' : '.'}`;
    }
  }
  const feeHistRows = feeHist.slice().reverse().map((snap,i)=>{
    const idx = feeHist.length-1-i;
    return `<div class="criteria-row"><div class="c-label">${snap.date}</div>
      <div class="c-val" style="width:auto;flex:1;text-align:right;">${snap.totalBps!=null?Math.round(snap.totalBps)+' bps':'—'}${snap.perParticipant!=null?' · $'+Math.round(snap.perParticipant).toLocaleString()+'/participant':''}</div>
      <button class="btn btn-ghost btn-sm no-print" data-remove-fee-snapshot="${idx}" style="color:var(--brick);">×</button>
    </div>`;
  }).join('') || `<div style="padding:14px;color:var(--ink-soft);font-size:12px;">No fee snapshots logged yet.</div>`;

  return `
  <div class="page-head">
    <div>
      <h1 class="page-title">Fee Analyzer — ${escapeHtml(plan.name)}</h1>
      <p class="page-desc">Recordkeeper, advisor, and investment costs rolled into one all-in estimate, asset-weighted once fund balances are on file — the other half of fiduciary fee review, separate from individual fund expense ratios.</p>
    </div>
    <div class="btn-row no-print"><button class="btn btn-primary" id="btn-print-fees">Print / Save PDF</button></div>
  </div>

  <div class="card no-print">
    <h3>Fund Assets</h3>
    <div class="card-desc">Dollars this plan currently has invested in each fund — pulled from your recordkeeper's plan asset statement. Powers the asset-weighted cost figure below instead of a simple average.</div>
    <div class="btn-row" style="margin-bottom:12px;">
      <button class="btn btn-sm" id="btn-import-balances">Import Balances CSV</button>
      <input type="file" id="balances-csv-input" accept=".csv" style="display:none;">
    </div>
    <div style="max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:5px;">
      <table>
        <thead><tr><th>Fund</th><th style="text-align:right">Assets Invested ($)</th><th style="text-align:right">% of Total</th></tr></thead>
        <tbody>${assetRows || '<tr><td colspan="3" style="padding:14px;color:var(--ink-soft);">Add funds in Fund Menu first.</td></tr>'}</tbody>
      </table>
    </div>
    <div class="field-note" style="margin-top:10px;">Total entered: $${totalFundAssets.toLocaleString()}${assetCheckNote?' — '+assetCheckNote:''}</div>
    <div class="field-note">CSV columns: ticker, planAssetsHeld — matches by ticker against funds already in this plan's menu.</div>
  </div>

  <div class="card no-print">
    <h3>Plan-Level Fees</h3>
    <div class="card-desc">Enter each fee the way it's actually quoted, and how it's actually paid — billed directly to the plan sponsor, or netted from participant accounts.</div>
    <div class="field-grid cols3">
      <div class="field"><label>Recordkeeping Fee</label><input type="number" step="0.01" id="fee-rk-amt" value="${f.recordkeepingAmt??''}"></div>
      <div class="field"><label>Type</label><select id="fee-rk-type"><option value="bps" ${f.recordkeepingType==='bps'?'selected':''}>bps of plan assets</option><option value="perParticipant" ${f.recordkeepingType==='perParticipant'?'selected':''}>$ per participant/year</option><option value="flat" ${f.recordkeepingType==='flat'?'selected':''}>Flat $ amount/year</option></select></div>
      <div class="field"><label>Paid Via</label>${sourceSelect('fee-rk-source', f.recordkeepingSource||'employer')}</div>
      <div class="field"><label>Advisor / Consultant Fee</label><input type="number" step="0.01" id="fee-adv-amt" value="${f.advisorAmt??''}"></div>
      <div class="field"><label>Type</label><select id="fee-adv-type"><option value="bps" ${f.advisorType==='bps'?'selected':''}>bps of plan assets</option><option value="perParticipant" ${f.advisorType==='perParticipant'?'selected':''}>$ per participant/year</option><option value="flat" ${f.advisorType==='flat'?'selected':''}>Flat $ amount/year</option></select></div>
      <div class="field"><label>Paid Via</label>${sourceSelect('fee-adv-source', f.advisorSource||'employer')}</div>
      <div class="field"><label>Other Fees (flat $/year)</label><input type="number" step="1" id="fee-other-amt" value="${f.otherAmt??''}"></div>
      <div class="field"><label>Label</label><input id="fee-other-label" value="${escapeHtml(f.otherLabel||'')}" placeholder="Audit, legal, TPA..."></div>
      <div class="field"><label>Paid Via</label>${sourceSelect('fee-other-source', f.otherSource||'employer')}</div>
    </div>
    <div class="field-note" style="margin-top:8px;">Requires Plan Assets and Participant Count (set in Plan Details) to convert between bps and dollars. Investment (fund expense ratio) costs are always netted from participant returns — that's inherent to how a fund's expense ratio works, not a choice to make here.</div>
    <div class="section-label">All Services, Flat Total (optional)</div>
    <div class="card-desc">If you have one combined number instead — e.g. from a single all-in quote or invoice — enter it here as a cross-check against the itemized total.</div>
    <div class="field-grid cols3">
      <div class="field"><label>Total Flat Fee, All Services ($/year)</label><input type="number" step="1" id="fee-allin-flat" value="${f.allInFlatAmt??''}"></div>
    </div>
  </div>

  <div class="card no-print">
    <h3>Revenue Sharing Offset</h3>
    <div class="card-desc">Computed automatically from each fund's Revenue Sharing (bps) field in Fund Menu and its dollar balance above — revenue sharing is compensation already built into a fund's expense ratio, not an added cost, so this is disclosure and offset accounting, not a new fee.</div>
    <div class="field-note" style="margin-bottom:10px;">Revenue sharing generated across the menu: <strong>${revenueSharingDollars>0?'$'+Math.round(revenueSharingDollars).toLocaleString()+'/yr'+(revenueSharingBpsTotal!=null?' ('+revenueSharingBpsTotal.toFixed(1)+' bps)':''):'—'}</strong>${revenueSharingHoldings.length?' across '+revenueSharingHoldings.length+' fund(s) with both a revenue-sharing rate and a balance on file.':' — no funds have both a revenue-sharing rate and a balance on file yet.'}</div>
    <div class="field" style="max-width:420px;">
      <label>What happens to this revenue sharing?</label>
      <select id="fee-rs-treatment">
        <option value="" ${treatment===''?'selected':''}>— Not yet determined —</option>
        <option value="offsetRecordkeeping" ${treatment==='offsetRecordkeeping'?'selected':''}>Offsets the recordkeeping fee billed to the employer</option>
        <option value="erisaBudget" ${treatment==='erisaBudget'?'selected':''}>Credited to an ERISA budget / forfeiture account</option>
        <option value="retainedByRecordkeeper" ${treatment==='retainedByRecordkeeper'?'selected':''}>Retained by the recordkeeper as compensation</option>
      </select>
    </div>
    ${treatment==='offsetRecordkeeping' && revenueSharingDollars>0 ? `<div class="field-note" style="margin-top:10px;">Net recordkeeping cost after offset: ${rkDollarsNet!=null?'$'+Math.round(rkDollarsNet).toLocaleString()+'/yr':'—'}${rkDollars!=null?' (down from $'+Math.round(rkDollars).toLocaleString()+' billed)':''}.</div>` : ''}
    ${revenueSharingExceedsRk ? `<div class="callout callout-amber" style="margin-top:10px;">Revenue sharing generated ($${Math.round(revenueSharingDollars).toLocaleString()}) exceeds the recordkeeping fee ($${Math.round(rkDollars).toLocaleString()}). Under DOL guidance the excess generally shouldn't be retained by the recordkeeper without disclosure — confirm where it's actually going (ERISA budget account, credited back to participants, etc.).</div>` : ''}
  </div>

  <div class="card no-print">
    <h3>Fee History</h3>
    <div class="card-desc">Log a snapshot each time you review fees, so you can see whether cost is trending down as plan assets grow — one of the standard reasonableness checks.</div>
    <div class="btn-row" style="margin-bottom:12px;"><button class="btn btn-sm" id="btn-log-fees">Log Current Fees</button></div>
    <div class="criteria-list">${feeHistRows}</div>
    ${feeTrendNote ? `<div class="field-note" style="margin-top:10px;">${feeTrendNote}</div>` : ''}
  </div>

  <div class="card no-print">
    <h3>Benchmark Comparison</h3>
    <div class="card-desc">There's no live fee-benchmarking feed wired into this tool — reasonableness is a documented judgment, not a computed fact. Enter a comparison range from a recordkeeper RFP, a fee-benchmarking service, or a consultant's study, and cite the source.</div>
    <div class="field-grid cols3">
      <div class="field"><label>Benchmark Low (bps)</label><input type="number" id="fee-bench-low" value="${f.benchmarkLowBps??''}"></div>
      <div class="field"><label>Benchmark High (bps)</label><input type="number" id="fee-bench-high" value="${f.benchmarkHighBps??''}"></div>
      <div class="field"><label>Comparison Date</label><input type="date" id="fee-bench-date" value="${escapeHtml(f.benchmarkDate||'')}"></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Source</label><input id="fee-bench-source" value="${escapeHtml(f.benchmarkSource||'')}" placeholder="e.g. 2026 recordkeeper RFP, NEPC DC survey, plan committee comparison study"></div>
  </div>

  <div class="report-doc">
    <div class="report-page">
      <div class="report-letterhead">
        <div><div class="rl-title">Plan Fee &amp; Cost Analysis</div><div class="rl-sub">${escapeHtml(plan.name)} — ${escapeHtml(plan.sponsor||'')}</div></div>
        <div class="rl-meta">Prepared ${genDate}<br>${totalFundAssets>0?'$'+totalFundAssets.toLocaleString()+' in fund balances analyzed':'No fund balances entered yet'}</div>
      </div>

      <div class="section-label">Cost by Service Line</div>
      <div class="criteria-list">
        <div class="criteria-row"><div class="c-label">Recordkeeping${treatment==='offsetRecordkeeping' && revenueSharingDollars>0?' (net of revenue sharing offset)':''}</div><div class="c-val" style="width:auto;flex:1;text-align:right;">${rkBpsNet!==null?fmt(rkBpsNet/100,'%')+' ('+Math.round(rkBpsNet)+' bps)':rkDollarsNet!=null?'$'+Math.round(rkDollarsNet).toLocaleString()+'/yr':'—'}</div></div>
        <div class="criteria-row"><div class="c-label">Advisor / Consultant</div><div class="c-val" style="width:auto;flex:1;text-align:right;">${advBps!==null?fmt(advBps/100,'%')+' ('+Math.round(advBps)+' bps)':advDollars!=null?'$'+Math.round(advDollars).toLocaleString()+'/yr':'—'}</div></div>
        <div class="criteria-row"><div class="c-label">Investment expenses (${usingWeighted?'asset-weighted across '+fundsWithBoth.length+' fund(s) with balances on file':'simple average — enter fund balances for a true weighted figure'})</div><div class="c-val" style="width:auto;flex:1;text-align:right;">${investmentBps!==null?fmt(investmentBps/100,'%')+' ('+Math.round(investmentBps)+' bps)':'—'}</div></div>
        <div class="criteria-row"><div class="c-label">Other (${escapeHtml(f.otherLabel||'flat fees')})</div><div class="c-val" style="width:auto;flex:1;text-align:right;">${otherDollarsForBps!==null?Math.round(otherDollarsForBps)+' bps equiv.':f.otherAmt?'$'+f.otherAmt.toLocaleString()+'/yr (needs plan assets to convert)':'—'}</div></div>
        <div class="criteria-row"><div class="c-label"><strong>Total estimated all-in cost</strong></div><div class="c-val" style="width:auto;flex:1;text-align:right;"><strong>${totalBps!==null?Math.round(totalBps)+' bps':'—'}${totalDollars!==null?' ('+'$'+Math.round(totalDollars).toLocaleString()+'/yr)':''}</strong></div></div>
        <div class="criteria-row"><div class="c-label">Per enrolled participant, per year</div><div class="c-val" style="width:auto;flex:1;text-align:right;">${perParticipantTotal!==null?'$'+Math.round(perParticipantTotal).toLocaleString():'—'}</div></div>
        <div class="criteria-row"><div class="c-label">Per eligible employee, per year</div><div class="c-val" style="width:auto;flex:1;text-align:right;">${perEligibleTotal!==null?'$'+Math.round(perEligibleTotal).toLocaleString():'—'}</div></div>
        <div class="criteria-row"><div class="c-label">Flat total, all services (as entered)</div><div class="c-val" style="width:auto;flex:1;text-align:right;">${f.allInFlatAmt!=null?'$'+f.allInFlatAmt.toLocaleString()+'/yr'+(allInFlatBps!==null?' ('+Math.round(allInFlatBps)+' bps)':''):'—'}</div></div>
      </div>
      ${flatCheckNote ? `<div class="field-note" style="margin-top:10px;">${flatCheckNote}</div>` : ''}

      <div class="section-label">Revenue Sharing</div>
      ${revenueSharingDollars>0 ? `<p style="font-size:12.5px;line-height:1.7;color:var(--ink);">$${Math.round(revenueSharingDollars).toLocaleString()}/yr in revenue sharing is generated across the fund menu (already reflected within investment expenses above, not an additional cost). ${treatment==='offsetRecordkeeping' ? 'This plan applies it to offset the recordkeeping fee billed to the employer.' : treatment==='erisaBudget' ? 'This plan credits it to an ERISA budget / forfeiture account for plan expenses or participant benefit.' : treatment==='retainedByRecordkeeper' ? 'This plan\'s recordkeeper retains it as part of its compensation.' : 'This plan has not yet documented what happens to it — worth resolving for 408(b)(2) disclosure completeness.'}</p>${revenueSharingExceedsRk ? `<div class="callout callout-amber">Revenue sharing generated exceeds the recordkeeping fee — confirm the excess isn't being retained without disclosure.</div>` : ''}` : `<div class="field-note">No revenue sharing data on file (needs both a Revenue Sharing rate and a balance for at least one fund).</div>`}

      <div class="section-label">Who Pays</div>
      ${hasPaymentData ? `
      <div class="criteria-list">
        <div class="criteria-row"><div class="c-label">Billed directly to the Plan Sponsor</div><div class="c-val" style="width:auto;flex:1;text-align:right;">$${Math.round(billedDollars).toLocaleString()}/yr</div></div>
        <div class="criteria-row"><div class="c-label">Netted from participant accounts (incl. fund expense ratios)</div><div class="c-val" style="width:auto;flex:1;text-align:right;">$${Math.round(nettedDollars).toLocaleString()}/yr</div></div>
        ${splitDollars>0 ? `<div class="criteria-row"><div class="c-label">Split / other arrangement</div><div class="c-val" style="width:auto;flex:1;text-align:right;">$${Math.round(splitDollars).toLocaleString()}/yr</div></div>` : ''}
      </div>` : `<div class="field-note">Enter recordkeeping/advisor/other fees above with a payment source to see this breakdown.</div>`}

      <div class="section-label">Fee History</div>
      ${feeHist.length ? `<div class="criteria-list">${feeHist.slice().reverse().map(snap=>`<div class="criteria-row"><div class="c-label">${snap.date}</div><div class="c-val" style="width:auto;flex:1;text-align:right;">${snap.totalBps!=null?Math.round(snap.totalBps)+' bps':'—'}${snap.perParticipant!=null?' · $'+Math.round(snap.perParticipant).toLocaleString()+'/participant':''}</div></div>`).join('')}</div>${feeTrendNote?`<div class="field-note" style="margin-top:8px;">${feeTrendNote}</div>`:''}` : `<div class="field-note">No fee snapshots logged yet.</div>`}

      <div class="section-label">Benchmark Comparison</div>
      ${reasonableness ? `<div class="callout callout-${reasonableness.cls==='red'?'red':'slate'}"><strong>${reasonableness.label}:</strong> ${reasonableness.note}</div><div class="field-note">Source: ${escapeHtml(f.benchmarkSource||'—')}${f.benchmarkDate?' · '+escapeHtml(f.benchmarkDate):''}</div>` : `<div class="field-note">No benchmark comparison on file yet.</div>`}

      <div class="report-foot">Investment expense figures reflect data entered by the reviewer as of the date shown. Reasonableness is a documented committee judgment, not an automated determination. This report does not constitute investment or fiduciary advice.</div>
    </div>
  </div>

  <div class="card no-print">
    <h3>How fee reasonableness is actually determined</h3>
    <p style="font-size:12.5px;line-height:1.7;color:var(--ink-soft);">This isn't something a formula can settle on its own — it's a documented, periodic process. In practice that means: (1) benchmarking this plan's total cost against comparable plans by size and services, typically via a recordkeeper RFP, a fee-benchmarking survey, or a consultant's comparability study; (2) checking whether fees have declined as plan assets have grown, since recordkeeping costs per participant should generally trend down with scale; (3) documenting the comparison and the committee's conclusion — in this tool, that's the benchmark fields above plus a note in Meetings; and (4) refreshing the comparison periodically, commonly every 3–5 years via a live RFP, even if the plan doesn't switch providers.</p>
  </div>`;
}

function renderMeetings(plan){
  const meetings = (plan.meetings||[]).slice().sort((a,b)=> b.date < a.date ? -1 : b.date > a.date ? 1 : 0);
  const rows = meetings.map(m=>{
    const acted = (m.decisions||[]).filter(d=>d.decision && d.decision!=='No Action');
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <h3>${m.date}</h3>
          <div class="card-desc" style="margin-bottom:6px;">${escapeHtml(m.attendees||'No attendees listed')}</div>
        </div>
        <button class="btn btn-ghost btn-sm no-print" data-remove-meeting="${m.id}" style="color:var(--brick);">Remove</button>
      </div>
      ${m.notes ? `<p style="font-size:12.5px;color:var(--ink);line-height:1.6;">${escapeHtml(m.notes)}</p>` : ''}
      ${acted.length ? `<div class="criteria-list" style="margin-top:10px;">${acted.map(d=>`<div class="criteria-row"><div class="c-label">${escapeHtml(d.name)}</div><div class="c-val" style="width:auto;flex:1;text-align:right;"><span class="status-pill status-${d.decision==='Retain'?'green':d.decision==='Formal Watch'?'yellow':'red'}">${escapeHtml(d.decision)}</span></div></div>`).join('')}</div>` : `<div class="field-note">No formal decisions recorded — informational meeting only.</div>`}
    </div>`;
  }).join('');

  return `
  <div class="page-head">
    <div>
      <h1 class="page-title">Meetings — ${escapeHtml(plan.name)}</h1>
      <p class="page-desc">A record that the fiduciary committee actually met, reviewed the fund menu, and made decisions — the piece that turns the scoring data into a documented process.</p>
    </div>
    <div class="btn-row no-print"><button class="btn btn-primary" id="btn-log-meeting">Log Meeting</button></div>
  </div>
  ${meetings.length===0 ? `<div class="table-wrap"><div class="empty-state"><h3>No meetings logged yet</h3><p>Log a meeting after each quarterly review to record who attended and what was decided for each fund.</p><button class="btn btn-primary no-print" id="btn-log-meeting-empty">Log Meeting</button></div></div>` : rows}
  `;
}

      <td>${escapeHtml(r.category||'—')}</td>
      <td class="num">${r.expenseRatio!=null?r.expenseRatio+'%':'—'}</td>
      <td>${r.tdfSeries ? '<span class="tag">TDF: '+escapeHtml(r.tdfSeries)+'</span>' : ''}</td>

  return `
  <div class="overlay" id="import-preview-overlay">
    <div class="modal wide">
      <div class="modal-head">
        <div>
          <div style="font-family:var(--serif);font-size:19px;font-weight:600;">Import Preview</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${p.rows.length} fund(s) ready to import${p.skipped.length ? ', '+p.skipped.length+' duplicate(s) skipped' : ''}. Nothing is saved until you confirm.</div>
        </div>
