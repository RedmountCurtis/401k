function renderMeetingModal(plan){
  const allHoldings = plan.holdings.filter(h=>!isTdfHolding(h));
  const tdfGroups = getTdfSeriesGroups(plan);
  const decisionOptions = ['No Action','Retain','Formal Watch','Replace / Remove'];
  const rows = [
    ...allHoldings.map(h=>({key:h.id, name:(h.ticker?h.ticker+' — ':'')+h.name})),
    ...tdfGroups.map(g=>({key:'series:'+g.seriesName, name:g.seriesName+' (TDF series)'})),
  ].map(item=>`
    <div class="ips-row" style="grid-template-columns:2fr 1fr;">
      <div style="align-self:center;font-size:12.5px;">${escapeHtml(item.name)}</div>
      <select data-decision-key="${escapeHtml(item.key)}">
        ${decisionOptions.map(o=>`<option value="${o}">${o}</option>`).join('')}
      </select>
    </div>`).join('');

  return `
  <div class="overlay" id="meeting-modal-overlay">
    <div class="modal wide">
      <div class="modal-head">
        <div style="font-family:var(--serif);font-size:19px;font-weight:600;">Log Meeting</div>
        <button class="modal-close" id="close-meeting-modal">×</button>
      </div>
      <div class="modal-body">
        <div class="field-grid cols3">
          <div class="field"><label>Meeting Date</label><input type="date" id="meeting-date" value="${todayStr()}"></div>
          <div class="field" style="grid-column:span 2;"><label>Attendees</label><input id="meeting-attendees" placeholder="Names, roles"></div>
        </div>
        <div class="field" style="margin-top:14px;"><label>Notes</label><textarea id="meeting-notes" rows="3" style="font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);resize:vertical;width:100%;"></textarea></div>
        <div class="section-label">Fund Decisions (optional — leave "No Action" for funds not discussed)</div>
        <div class="ips-row head" style="grid-template-columns:2fr 1fr;"><div>Fund / Series</div><div>Decision</div></div>
        ${rows || '<div class="field-note" style="padding:10px 0;">No funds in this plan\'s menu yet.</div>'}
        <div class="btn-row" style="margin-top:24px; justify-content:flex-end;">
          <button class="btn" id="cancel-meeting-modal">Cancel</button>
          <button class="btn btn-primary" id="save-meeting-modal">Save Meeting</button>
        </div>
      </div>
    </div>
  </div>`;
}


function renderReports(plan){
  const nonTdf = plan.holdings.filter(h=>!isTdfHolding(h));
  const tdfGroups = getTdfSeriesGroups(plan);
  if(nonTdf.length===0 && tdfGroups.length===0){
    return `<div class="page-head"><div><h1 class="page-title">Reports — ${escapeHtml(plan.name)}</h1><p class="page-desc">Add funds to this plan first.</p></div></div>`;
  }
  const chips = nonTdf.map(h=>`<div class="chip ${plan.reportSelection.includes(h.id)?'on':''}" data-chip="${h.id}">${escapeHtml(h.ticker||h.name)}</div>`).join('');
  const selected = nonTdf.filter(h=>plan.reportSelection.includes(h.id));
  const genDate = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

  const fundPages = selected.map(h=>{
    const s = computeScores(h, nonTdf, plan.criteria, plan);
    const rows = s.breakdown.map(b=>{
      const meta = FIELD_META[b.key]||{};
      return `<div class="criteria-row"><div class="c-label">${escapeHtml(b.label)}</div>
        <div class="c-val">${fmt(b.value, meta.unit)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${b.pct??0}%;background:${scoreColor(b.pct)}"></div></div>
        <div class="c-pct">${b.pct===null?'—':b.pct}</div></div>`;
    }).join('');
    return `
    <div class="report-page">
      <div class="report-fund-header">
        <div><h2>${escapeHtml(h.ticker)} — ${escapeHtml(h.name)}</h2><div class="rf-sub">${escapeHtml(h.category||'Uncategorized')}${h.shareClass?' · '+escapeHtml(h.shareClass):''} · Reviewed ${genDate}</div></div>
        <div>${renderSeal(s.overall, s.status)}</div>
      </div>
      ${s.hardFail ? `<div class="callout callout-red"><strong>IPS hard-criterion failure:</strong> ${escapeHtml(s.hardFail)}</div>` : ''}
      <div class="report-summary-line"><strong>Status: ${statusLabel(s.status)}.</strong> Composite score of ${s.overall}/100 across ${s.breakdown.length} IPS criteria, ranked against ${s.peerCount} fund(s) in the ${s.peerTier==='full'?'full plan menu (thin peer group)':s.peerTier==='assetClass'?'broad asset-class peer set':'category peer group'}.${h.benchmarkIndex?' Benchmarked against '+escapeHtml(h.benchmarkIndex)+'.':''}${consecutiveWatchQuarters(h.history)>=2?' '+consecutiveWatchQuarters(h.history)+' consecutive quarter(s) without a Pass'+(consecutiveWatchQuarters(h.history)>=plan.watchQuarterTrigger?' — meets the review trigger.':'.'):''}</div>
      <div class="criteria-list">${rows}</div>
      ${(h.history||[]).length>=2 ? `<div class="section-label">Score Trend</div>${renderScoreTrendChart(h.history, plan)}` : ''}
      <div class="report-foot">Prepared for plan fiduciary review. Percentile scores are relative to the peer set defined above and reflect data entered by the reviewer as of the date shown. This report does not constitute investment advice.</div>
    </div>`;
  }).join('');

  const tdfPages = tdfGroups.map(series=>{
    const ev = evaluateTdfSeries(series, plan.tdfExpenseCap);
    const vRows = series.holdings.map(h=>`<div class="criteria-row">
      <div class="c-label">${h.tdfVintageYear} vintage${h.ticker?' · '+escapeHtml(h.ticker):''}</div>
      <div class="c-val" style="width:auto;flex:1;text-align:right;">${typeof h.equityAllocation==='number'?h.equityAllocation+'% eq.':'—'} · ${fmt(h.expenseRatio,'%')} · ${fmt(h.return3y,'%')} vs ${fmt(h.benchmarkReturn3y,'%')} bmk</div>
    </div>`).join('');
    return `
    <div class="report-page">
      <div class="report-fund-header">
        <div><h2>${escapeHtml(series.seriesName)}</h2><div class="rf-sub">${series.glidePathType==='through'?'Through-retirement':'To-retirement'} glide path · Reviewed ${genDate}</div></div>
        <span class="status-pill status-${ev.status}" style="font-size:12px;padding:6px 14px 6px 10px;">${statusLabel(ev.status)}</span>
      </div>
      ${ev.glideFlag ? `<div class="callout callout-red"><strong>Glide path finding:</strong> ${escapeHtml(ev.glideFlag)}</div>` : ''}
      <div class="report-summary-line">Average expense ratio ${fmt(ev.avgExpense,'%')} vs. plan cap of ${fmt(plan.tdfExpenseCap,'%')}. Average 3-yr excess return vs. ${escapeHtml(series.benchmarkIndex||'named benchmark')}: ${ev.avgExcess===null?'—':fmt(ev.avgExcess,'%')}, based on ${ev.withDataCount} of ${ev.vintageCount} vintage(s) with complete data.</div>
      <div class="criteria-list">${vRows || '<div style="padding:14px;color:var(--ink-soft);font-size:12px;">No vintages entered.</div>'}</div>
      <div class="report-foot">Target-date evaluation is separate from the active/passive fund scoring methodology and reflects glide path structure, cost, and benchmark-relative performance across vintages.</div>
    </div>`;
  }).join('');

  const anySelected = selected.length>0 || tdfGroups.length>0;

  return `
  <div class="page-head">
    <div><h1 class="page-title">Reports — ${escapeHtml(plan.name)}</h1><p class="page-desc">Select funds to include. Target-date series are always included when present. Print or save as PDF using your browser's print dialog.</p></div>
    <div class="btn-row"><button class="btn btn-primary" id="btn-print-report" ${!anySelected?'disabled':''}>Print / Save PDF</button></div>
  </div>
  ${nonTdf.length ? `<div class="report-fund-pick no-print">${chips}</div>` : ''}
  ${!anySelected ? `<div class="table-wrap"><div class="empty-state"><h3>Select funds above</h3><p>Choose one or more funds, or add a target-date series, to generate a report.</p></div></div>` : `
  <div class="report-doc">
    <div class="report-page" style="border-bottom:none;padding-bottom:0;">
      <div class="report-letterhead">
        <div><div class="rl-title">401(k) Plan Investment Due Diligence Report</div><div class="rl-sub">${escapeHtml(plan.name)} — ${escapeHtml(plan.sponsor||'')}</div></div>
        <div class="rl-meta">Prepared ${genDate}<br>${selected.length} fund(s) · ${tdfGroups.length} TDF series</div>
      </div>
    </div>
    ${fundPages}${tdfPages}
  </div>`}
  `;
}

/* ------------------------------ handlers -------------------------------- */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{ el.onclick = ()=>{ state.view = el.dataset.nav; render(); }; });

  const switcher = document.getElementById('plan-switcher');
  if(switcher) switcher.onchange = ()=>{ state.currentPlanId = switcher.value; ui.selectedFunds = new Set(); if(state.view==='overview') state.view='watchlist'; saveState(); render(); };

  document.querySelectorAll('#btn-new-plan, #btn-new-plan-main, #btn-new-plan-empty').forEach(el=>{
    el.onclick = ()=>{ ui.planModal=true; ui.planModalNew=true; render(); };
  });
  const editPlanBtn = document.getElementById('btn-edit-plan');
  if(editPlanBtn) editPlanBtn.onclick = ()=>{ ui.planModal=true; ui.planModalNew=false; render(); };
  document.querySelectorAll('[data-open-plan]').forEach(el=>{
    el.onclick = ()=>{ state.currentPlanId = el.dataset.openPlan; state.view='watchlist'; saveState(); render(); };
  });

  // plan modal
  const pOverlay = document.getElementById('plan-modal-overlay');
  if(pOverlay) pOverlay.onclick = (e)=>{ if(e.target.id==='plan-modal-overlay'){ ui.planModal=false; render(); } };
  const pClose = document.getElementById('close-plan-modal'); if(pClose) pClose.onclick = ()=>{ ui.planModal=false; render(); };
  const pCancel = document.getElementById('cancel-plan-modal'); if(pCancel) pCancel.onclick = ()=>{ ui.planModal=false; render(); };
  const pSave = document.getElementById('save-plan-modal');
  if(pSave) pSave.onclick = ()=>{
    const overlayEl = document.getElementById('plan-modal-overlay');
    const inputs = overlayEl.querySelectorAll('[data-pfield]');
    const data = {};
    inputs.forEach(inp=>{
      const key = inp.dataset.pfield;
      const numeric = ['participantCount','planAssets','tdfExpenseCap'].includes(key);
      data[key] = numeric ? (inp.value===''?null:Number(inp.value)) : inp.value;
    });
    if(!data.name){ alert('Plan name is required.'); return; }
    if(data.qdiaCombo !== undefined){
      if(data.qdiaCombo){ const [t,k] = data.qdiaCombo.split('::'); data.qdiaType=t; data.qdiaKey=k; }
      else { data.qdiaType=''; data.qdiaKey=''; }
      delete data.qdiaCombo;
    }
    if(ui.planModalNew){
      const p = newPlan(data.name); Object.assign(p, data); state.plans.push(p); state.currentPlanId = p.id; state.view='watchlist';
    }else{
      Object.assign(currentPlan(), data);
    }
    ui.planModal=false; saveState(); render();
  };
  const pDelete = document.getElementById('btn-delete-plan');
  if(pDelete) pDelete.onclick = ()=>{
    if(confirm('Delete this plan and all its fund data? This cannot be undone.')){
      state.plans = state.plans.filter(p=>p.id!==state.currentPlanId);
      state.currentPlanId = state.plans.length ? state.plans[0].id : null;
      ui.planModal=false; state.view = state.plans.length ? 'watchlist' : 'overview';
      saveState(); render();
    }
  };

  const plan = currentPlan();

  // watchlist
  document.querySelectorAll('#btn-add-fund, #btn-add-fund-empty').forEach(el=>{
    el.onclick = ()=>{ ui.isNew=true; ui.modalFund='new'; render(); };
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{ el.onclick=(e)=>{ e.stopPropagation(); ui.isNew=false; ui.replaceMode=false; ui.modalFund=el.dataset.edit; render(); }; });
  document.querySelectorAll('[data-replace]').forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const h = plan.holdings.find(x=>x.id===el.dataset.replace);
      ui.isNew=false; ui.replaceMode=true; ui.replaceOldTicker = h.ticker || h.name || 'previous fund';
      ui.modalFund=el.dataset.replace; render();
    };
  });
  document.querySelectorAll('[data-select-fund]').forEach(el=>{
    el.onclick=(e)=>{ e.stopPropagation(); };
    el.onchange=()=>{
      if(el.checked) ui.selectedFunds.add(el.dataset.selectFund); else ui.selectedFunds.delete(el.dataset.selectFund);
      render();
    };
  });
  const selectAll = document.getElementById('select-all-funds');
  if(selectAll) selectAll.onchange = ()=>{
    const nonTdf = plan.holdings.filter(h=>!isTdfHolding(h));
    if(selectAll.checked) nonTdf.forEach(h=>ui.selectedFunds.add(h.id));
    else nonTdf.forEach(h=>ui.selectedFunds.delete(h.id));
    render();
  };
  const deleteSelected = document.getElementById('btn-delete-selected');
  if(deleteSelected) deleteSelected.onclick = ()=>{
    if(confirm(`Delete ${ui.selectedFunds.size} selected fund(s)? This cannot be undone.`)){
      plan.holdings = plan.holdings.filter(h=>!ui.selectedFunds.has(h.id));
      ui.selectedFunds = new Set();
      saveState(); render();
    }
  };
  document.querySelectorAll('[data-detail]').forEach(el=>{ el.onclick=(e)=>{ if(e.target.closest('[data-no-detail]')) return; ui.detailFund=el.dataset.detail; render(); }; });
  const runReview = document.getElementById('btn-run-review');
  if(runReview) runReview.onclick = ()=>{
    const date = todayStr();
    plan.holdings.forEach(h=>{
      const s = computeScores(h, plan.holdings, plan.criteria, plan);
      h.history = h.history || [];
      const last = h.history[h.history.length-1];
      if(last && last.date === date){ last.overall = s.overall; last.status = s.status; } // same-day re-run updates in place, doesn't duplicate
      else h.history.push({date, overall:s.overall, status:s.status});
    });
    saveState(); render();
  };
  const clearHistory = document.getElementById('btn-clear-history');
  if(clearHistory) clearHistory.onclick = ()=>{
    if(confirm('Clear all logged review history for every fund in this plan? This cannot be undone.')){
      plan.holdings.forEach(h=>{ h.history = []; });
      saveState(); render();
    }
  };
  const importBtn = document.getElementById('btn-import');
  if(importBtn) importBtn.onclick = ()=> document.getElementById('csv-input').click();
  const csvInput = document.getElementById('csv-input');
  if(csvInput) csvInput.onchange = handleCsvImport;
  const pullLib = document.getElementById('btn-pull-library');
  if(pullLib) pullLib.onclick = ()=>{
    const n = pullPlanFromLibrary(plan);
    saveState(); render();
    alert(n>0 ? n+' fund(s) updated from the Fund Library.' : "No matching library data to pull in — either no tickers match, or this plan's funds already have those fields filled in.");
  };
  const pushLib = document.getElementById('btn-push-library');
  if(pushLib) pushLib.onclick = ()=>{
    const n = pushPlanToLibrary(plan);
    saveState(); render();
    alert(n>0 ? n+' fund(s) contributed to the Fund Library.' : 'Nothing new to contribute — library already has this data, or these funds have no ticker.');
  };

  // Fund Library page
  document.querySelectorAll('#btn-add-library, #btn-add-library-empty').forEach(el=>{
    el.onclick = ()=>{ ui.libraryIsNew=true; ui.libraryModal='new'; render(); };
  });
  document.querySelectorAll('[data-edit-library]').forEach(el=>{
    el.onclick = ()=>{ ui.libraryIsNew=false; ui.libraryModal=el.dataset.editLibrary; render(); };
  });
  document.querySelectorAll('[data-remove-library]').forEach(el=>{
    el.onclick = ()=>{
      if(confirm('Remove '+el.dataset.removeLibrary+' from the shared Fund Library? Plans that already pulled its data keep what they have — this only removes it from the library going forward.')){
        delete state.fundLibrary[el.dataset.removeLibrary];
        saveState(); render();
      }
    };
  });
  const closeLib = document.getElementById('close-library-modal'); if(closeLib) closeLib.onclick = ()=>{ ui.libraryModal=null; render(); };
  const cancelLib = document.getElementById('cancel-library-modal'); if(cancelLib) cancelLib.onclick = ()=>{ ui.libraryModal=null; render(); };
  const libOverlay = document.getElementById('library-modal-overlay');
  if(libOverlay) libOverlay.onclick = (e)=>{ if(e.target.id==='library-modal-overlay'){ ui.libraryModal=null; render(); } };
  const delLib = document.getElementById('btn-delete-library');
  if(delLib) delLib.onclick = ()=>{
    if(confirm('Remove this fund from the library?')){ delete state.fundLibrary[ui.libraryModal]; ui.libraryModal=null; saveState(); render(); }
  };
  const saveLib = document.getElementById('save-library-modal');
  if(saveLib) saveLib.onclick = ()=>{
    const overlayEl = document.getElementById('library-modal-overlay');
    const inputs = overlayEl.querySelectorAll('[data-lfield]');
    const data = {};
    inputs.forEach(inp=>{
      const key = inp.dataset.lfield;
      const isNumeric = FIELD_META[key] !== undefined;
      data[key] = isNumeric ? (inp.value===''?null:Number(inp.value)) : inp.value;
    });
    const tk = (ui.libraryIsNew ? data.ticker : ui.libraryModal || '').trim().toUpperCase();
    if(!tk){ alert('Ticker is required.'); return; }
    if(ui.libraryIsNew && state.fundLibrary[tk]){ alert('That ticker is already in the library — edit it instead of adding a duplicate.'); return; }
    data.ticker = tk;
    data.updatedDate = todayStr();
    state.fundLibrary[tk] = Object.assign(state.fundLibrary[tk]||{}, data);
    ui.libraryModal = null; ui.libraryIsNew = false;
    saveState(); render();
  };
  const importLibBtn = document.getElementById('btn-import-library');
  if(importLibBtn) importLibBtn.onclick = ()=> document.getElementById('library-csv-input').click();
  const libraryCsvInput = document.getElementById('library-csv-input');
  if(libraryCsvInput) libraryCsvInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    Papa.parse(file, {
      header:true, skipEmptyLines:true, dynamicTyping:true,
      complete: (results)=>{
        let added=0, updated=0;
        results.data.forEach(r=>{
          const tk = String(r.ticker||'').trim().toUpperCase();
          if(!tk) return;
          const entry = state.fundLibrary[tk] || { ticker: tk };
          LIBRARY_FIELDS.forEach(f=>{ if(notBlank(r[f])) entry[f] = r[f]; });
          entry.updatedDate = todayStr();
          if(state.fundLibrary[tk]) updated++; else added++;
          state.fundLibrary[tk] = entry;
        });
        saveState(); render();
        alert(added+' fund(s) added, '+updated+' updated in the library.');
      },
      error: ()=> alert('Could not parse that CSV. Check the column headers and try again.')
    });
    e.target.value = '';
  };

  // import preview
  const closePreview = document.getElementById('close-import-preview'); if(closePreview) closePreview.onclick = ()=>{ ui.importPreview=null; render(); };
  const cancelPreview = document.getElementById('cancel-import-preview'); if(cancelPreview) cancelPreview.onclick = ()=>{ ui.importPreview=null; render(); };
  const previewOverlay = document.getElementById('import-preview-overlay');
  if(previewOverlay) previewOverlay.onclick = (e)=>{ if(e.target.id==='import-preview-overlay'){ ui.importPreview=null; render(); } };
  const confirmPreview = document.getElementById('confirm-import-preview'); if(confirmPreview) confirmPreview.onclick = confirmImportPreview;

  // fund modal
  const overlay = document.getElementById('fund-modal-overlay');
  if(overlay) overlay.onclick=(e)=>{ if(e.target.id==='fund-modal-overlay') closeFundModal(); };
  const closeBtn = document.getElementById('close-fund-modal'); if(closeBtn) closeBtn.onclick = closeFundModal;
  const cancelBtn = document.getElementById('cancel-fund-modal'); if(cancelBtn) cancelBtn.onclick = closeFundModal;
  const saveBtn = document.getElementById('save-fund-modal'); if(saveBtn) saveBtn.onclick = saveFundFromModal;
  const delBtn = document.getElementById('btn-delete-fund');
  if(delBtn) delBtn.onclick = ()=>{ plan.holdings = plan.holdings.filter(h=>h.id!==ui.modalFund); ui.modalFund=null; saveState(); render(); };
  const tickerInput = document.getElementById('fund-modal-ticker');
  if(tickerInput) tickerInput.onblur = ()=>{
    const tk = tickerInput.value.trim().toUpperCase();
    const entry = tk && state.fundLibrary[tk];
    if(!entry) return;
    const modalRoot = document.getElementById('fund-modal-overlay');
    let filled = 0;
    LIBRARY_FIELDS.forEach(f=>{
      const input = modalRoot.querySelector(`[data-field="${f}"]`);
      if(!input) return;
      const currentBlank = input.tagName==='SELECT' ? false : !input.value;
      if(currentBlank && notBlank(entry[f])){ input.value = entry[f]; filled++; }
    });
    if(filled>0){
      const hint = document.getElementById('library-hint');
      if(hint) hint.textContent = `Filled ${filled} field(s) from the Fund Library for ${tk}.`;
    }
  };

  // detail modal
  const dOverlay = document.getElementById('detail-modal-overlay');
  if(dOverlay) dOverlay.onclick=(e)=>{ if(e.target.id==='detail-modal-overlay'){ ui.detailFund=null; render(); } };
  const dClose = document.getElementById('close-detail-modal'); if(dClose) dClose.onclick = ()=>{ ui.detailFund=null; render(); };
  document.querySelectorAll('[data-remove-history]').forEach(el=>{
    el.onclick = ()=>{
      const [holdingId, idx] = el.dataset.removeHistory.split(':');
      const h = plan.holdings.find(x=>x.id===holdingId);
      if(h && h.history) h.history.splice(Number(idx),1);
      saveState(); render();
    };
  });

  // criteria page
  document.querySelectorAll('[data-crit]').forEach(el=>{
    el.onchange = ()=>{
      const idx = Number(el.dataset.idx); const field = el.dataset.crit;
      if(field==='hard') plan.criteria[idx].hard = el.checked;
      else if(field==='weight') plan.criteria[idx].weight = Number(el.value)||0;
      else plan.criteria[idx][field] = el.value;
      if(field==='hard' && el.checked && plan.criteria[idx].hardMin==null) plan.criteria[idx].hardMin = 0;
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-remove-crit]').forEach(el=>{ el.onclick=()=>{ plan.criteria.splice(Number(el.dataset.removeCrit),1); saveState(); render(); }; });
  const addCrit = document.getElementById('btn-add-criterion');
  if(addCrit) addCrit.onclick = ()=>{ plan.criteria.push({ key:'custom_'+uid(), label:'New Criterion', direction:'higher', weight:0, hard:false }); saveState(); render(); };
  const resetCrit = document.getElementById('btn-reset-criteria');
  if(resetCrit) resetCrit.onclick = ()=>{ if(confirm("Reset this plan's criteria to the default IPS set?")){ plan.criteria = JSON.parse(JSON.stringify(DEFAULT_CRITERIA)); saveState(); render(); } };
  const gT = document.getElementById('green-threshold'); if(gT) gT.onchange = ()=>{ plan.greenThreshold = Number(gT.value); saveState(); render(); };
  const yT = document.getElementById('yellow-threshold'); if(yT) yT.onchange = ()=>{ plan.yellowThreshold = Number(yT.value); saveState(); render(); };
  const wT = document.getElementById('watch-trigger'); if(wT) wT.onchange = ()=>{ plan.watchQuarterTrigger = Number(wT.value)||4; saveState(); render(); };

  // Employees & Participants
  const ptEligible = document.getElementById('pt-eligible'); if(ptEligible) ptEligible.onchange = ()=>{ plan.eligibleEmployeeCount = ptEligible.value===''?null:Number(ptEligible.value); saveState(); render(); };
  const ptEnrolled = document.getElementById('pt-enrolled'); if(ptEnrolled) ptEnrolled.onchange = ()=>{ plan.participantCount = ptEnrolled.value===''?null:Number(ptEnrolled.value); saveState(); render(); };

  // Fee Analyzer
  const feeFieldMap = {
    'fee-rk-amt': ['recordkeepingAmt', true], 'fee-rk-type': ['recordkeepingType', false], 'fee-rk-source': ['recordkeepingSource', false],
    'fee-adv-amt': ['advisorAmt', true], 'fee-adv-type': ['advisorType', false], 'fee-adv-source': ['advisorSource', false],
    'fee-other-amt': ['otherAmt', true], 'fee-other-label': ['otherLabel', false], 'fee-other-source': ['otherSource', false],
    'fee-allin-flat': ['allInFlatAmt', true],
    'fee-bench-low': ['benchmarkLowBps', true], 'fee-bench-high': ['benchmarkHighBps', true],
    'fee-bench-date': ['benchmarkDate', false], 'fee-bench-source': ['benchmarkSource', false],
    'fee-rs-treatment': ['revenueSharingTreatment', false],
  };
  Object.keys(feeFieldMap).forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const [key, numeric] = feeFieldMap[id];
    el.onchange = ()=>{ plan.fees[key] = numeric ? (el.value===''?null:Number(el.value)) : el.value; saveState(); render(); };
  });
  document.querySelectorAll('[data-asset-fund]').forEach(el=>{
    el.onchange = ()=>{
      const h = plan.holdings.find(x=>x.id===el.dataset.assetFund);
      if(h) h.planAssetsHeld = el.value===''?null:Number(el.value);
      saveState(); render();
    };
  });
  const printFees = document.getElementById('btn-print-fees'); if(printFees) printFees.onclick = ()=> window.print();
  const logFeesBtn = document.getElementById('btn-log-fees');
  if(logFeesBtn) logFeesBtn.onclick = ()=>{
    const snap = computeFeeSnapshot(plan);
    const date = todayStr();
    plan.feeHistory = plan.feeHistory || [];
    const last = plan.feeHistory[plan.feeHistory.length-1];
    if(last && last.date === date) Object.assign(last, snap, {date});
    else plan.feeHistory.push(Object.assign({date}, snap));
    saveState(); render();
  };
  document.querySelectorAll('[data-remove-fee-snapshot]').forEach(el=>{
    el.onclick = ()=>{
      plan.feeHistory.splice(Number(el.dataset.removeFeeSnapshot),1);
      saveState(); render();
    };
  });
  const importBalancesBtn = document.getElementById('btn-import-balances');
  if(importBalancesBtn) importBalancesBtn.onclick = ()=> document.getElementById('balances-csv-input').click();
  const balancesCsvInput = document.getElementById('balances-csv-input');
  if(balancesCsvInput) balancesCsvInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    Papa.parse(file, {
      header:true, skipEmptyLines:true, dynamicTyping:false, // dynamicTyping off: amounts often arrive as "$1,234.56" strings
      complete: (results)=>{
        // Recordkeepers all name these columns differently — accept common aliases instead of
        // requiring an exact "ticker"/"planAssetsHeld" match. Checked in priority order (not the
        // column's position in the file) so a specific "planAssetsHeld" column always wins over a
        // generic "aum" column when a file happens to have both.
        const tickerKeys = ['ticker','symbol','fund symbol','fund ticker'];
        const amountKeys = ['planassetsheld','balance','ending balance','market value','value','amount','assets','aum'];
        const findKey = (row, candidatesInPriorityOrder) => {
          const lower = {}; Object.keys(row).forEach(k=>{ lower[k.trim().toLowerCase()] = k; });
          for(const c of candidatesInPriorityOrder){ if(lower[c]) return lower[c]; }
          return undefined;
        };
        let matched = 0; const unmatched = [];
        results.data.forEach(r=>{
          const tKey = findKey(r, tickerKeys), aKey = findKey(r, amountKeys);
          if(!tKey || !aKey) return;
          const tk = String(r[tKey]||'').trim().toUpperCase();
          const rawAmt = String(r[aKey]||'').replace(/[$,]/g,'').trim();
          const amt = rawAmt==='' ? null : Number(rawAmt);
          if(!tk || amt==null || isNaN(amt)) return;
          const h = plan.holdings.find(x=>(x.ticker||'').trim().toUpperCase()===tk);
          if(h){ h.planAssetsHeld = amt; matched++; }
          else unmatched.push(r[tKey]);
        });
        saveState(); render();
        alert(matched + ' fund balance(s) updated.' + (unmatched.length ? ' No match found for: '+unmatched.join(', ') : ''));
      },
      error: ()=> alert('Could not parse that CSV. Check the column headers and try again.')
    });
    e.target.value = '';
  };

  // reports
  document.querySelectorAll('[data-chip]').forEach(el=>{
    el.onclick = ()=>{ const id=el.dataset.chip; const i=plan.reportSelection.indexOf(id); if(i>-1) plan.reportSelection.splice(i,1); else plan.reportSelection.push(id); saveState(); render(); };
  });
  const printBtn = document.getElementById('btn-print-report'); if(printBtn) printBtn.onclick = ()=> window.print();

  // TDF page — "add" buttons open the same Fund modal, pre-flagged to focus the TDF section
  document.querySelectorAll('#btn-add-tdf-empty, #btn-add-tdf-empty2').forEach(el=>{
    el.onclick = ()=>{ ui.isNew=true; ui.modalFund='new'; ui.focusTdfSection=true; render(); };
  });
  document.querySelectorAll('[data-toggle-tdf]').forEach(el=>{
    el.onclick = (e)=>{ if(e.target.closest('button')) return; const id = el.dataset.toggleTdf; ui.openTdfCard = ui.openTdfCard===id ? null : id; render(); };
  });
  document.querySelectorAll('[data-remove-vintage]').forEach(el=>{
    el.onclick = ()=>{
      if(confirm('Remove this vintage fund? This cannot be undone.')){
        plan.holdings = plan.holdings.filter(h=>h.id!==el.dataset.removeVintage);
        saveState(); render();
      }
    };
  });
  document.querySelectorAll('[data-delete-series]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const seriesName = el.dataset.deleteSeries;
      const count = plan.holdings.filter(h=>isTdfHolding(h) && h.tdfSeries===seriesName).length;
      if(confirm(`Delete the entire "${seriesName}" series — all ${count} vintage(s)? This cannot be undone.`)){
        plan.holdings = plan.holdings.filter(h=>!(isTdfHolding(h) && h.tdfSeries===seriesName));
        saveState(); render();
      }
    };
  });

  // IPS document
  document.querySelectorAll('[data-ipsfield]').forEach(el=>{
    el.onchange = ()=>{ plan.ipsNarrative[el.dataset.ipsfield] = el.value; saveState(); };
  });
  const printIps = document.getElementById('btn-print-ips'); if(printIps) printIps.onclick = ()=> window.print();

  // Meetings
  document.querySelectorAll('#btn-log-meeting, #btn-log-meeting-empty').forEach(el=>{
    el.onclick = ()=>{ ui.meetingModal = true; render(); };
  });
  const closeMeeting = document.getElementById('close-meeting-modal'); if(closeMeeting) closeMeeting.onclick = ()=>{ ui.meetingModal=false; render(); };
  const cancelMeeting = document.getElementById('cancel-meeting-modal'); if(cancelMeeting) cancelMeeting.onclick = ()=>{ ui.meetingModal=false; render(); };
  const meetingOverlay = document.getElementById('meeting-modal-overlay');
  if(meetingOverlay) meetingOverlay.onclick = (e)=>{ if(e.target.id==='meeting-modal-overlay'){ ui.meetingModal=false; render(); } };
  const saveMeeting = document.getElementById('save-meeting-modal');
  if(saveMeeting) saveMeeting.onclick = ()=>{
    const date = document.getElementById('meeting-date').value || todayStr();
    const attendees = document.getElementById('meeting-attendees').value;
    const notes = document.getElementById('meeting-notes').value;
    const decisions = [];
    document.querySelectorAll('[data-decision-key]').forEach(sel=>{
      const row = sel.closest('.ips-row');
      const name = row ? row.querySelector('div').textContent : sel.dataset.decisionKey;
      decisions.push({ key: sel.dataset.decisionKey, name, decision: sel.value });
    });
    plan.meetings = plan.meetings || [];
    plan.meetings.push({ id: uid(), date, attendees, notes, decisions });
    ui.meetingModal = false;
    saveState(); render();
  };
  document.querySelectorAll('[data-remove-meeting]').forEach(el=>{
    el.onclick = ()=>{
      if(confirm('Remove this meeting record? This cannot be undone.')){
        plan.meetings = (plan.meetings||[]).filter(m=>m.id!==el.dataset.removeMeeting);
        saveState(); render();
      }
    };
  });

  // Data export
  document.querySelectorAll('[data-export-plan]').forEach(el=>{
    el.onclick = ()=>{
      const p = state.plans.find(x=>x.id===el.dataset.exportPlan);
      if(!p) return;
      const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = (p.name||'plan').replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '-backup.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };
  });
}

function closeFundModal(){ ui.modalFund = null; ui.focusTdfSection=false; ui.replaceMode=false; ui.replaceOldTicker=null; render(); }

// Finds an existing holding with the same ticker (or same name, when ticker is blank) so a fund
// can't get silently duplicated across two rows — which would split its data and skew scoring.
// Fields that describe the security itself, not this plan's relationship to it — these are what
// get shared across plans via the Fund Library. Ticker, balances, notes, and history stay per-plan.
const LIBRARY_FIELDS = ['name','category','assetClass','shareClass','expenseRatio','managerTenure',
  'alpha3y','sharpe3y','stdDev3y','rSquared3y','upCapture3y','downCapture3y','return3y','return5y',
  'benchmarkIndex','benchmarkReturn3y','revenueSharingBps','aum','tdfSeries','tdfVintageYear',
  'tdfGlidePathType','equityAllocation'];
function notBlank(v){ return v!==null && v!==undefined && v!==''; }

// Push this plan's fund data up into the shared library — merge-fill only (a holding's non-blank
// field overwrites the library's value for that field), so pushing an incomplete fund never erases
// good data another plan already contributed for the same ticker.
function pushPlanToLibrary(plan){
  let updated = 0;
  plan.holdings.forEach(h=>{
    const tk = (h.ticker||'').trim().toUpperCase();
    if(!tk) return;
    if(!state.fundLibrary[tk]) state.fundLibrary[tk] = { ticker: tk };
    const entry = state.fundLibrary[tk];
    let changed = false;
    LIBRARY_FIELDS.forEach(f=>{ if(notBlank(h[f])){ if(entry[f] !== h[f]){ entry[f] = h[f]; changed = true; } } });
    if(changed){ entry.updatedDate = todayStr(); updated++; }
  });
  return updated;
}

// Pull shared data down from the library into this plan's funds — same merge-fill rule in reverse:
// only fills a holding's blank fields, never overwrites something the plan already has entered.
function pullPlanFromLibrary(plan){
  let updated = 0;
  plan.holdings.forEach(h=>{
    const tk = (h.ticker||'').trim().toUpperCase();
    const entry = tk && state.fundLibrary[tk];
    if(!entry) return;
    let changed = false;
    LIBRARY_FIELDS.forEach(f=>{ if(!notBlank(h[f]) && notBlank(entry[f])){ h[f] = entry[f]; changed = true; } });
    if(changed) updated++;
  });
  if(updated) autoTagTdfHoldings(plan);
  return updated;
}

function findDuplicateHolding(plan, ticker, name, excludeId){
  const t = (ticker||'').trim().toUpperCase();
  const n = (name||'').trim().toLowerCase();
  return plan.holdings.find(h=>{
    if(h.id===excludeId) return false;
    if(t) return (h.ticker||'').trim().toUpperCase()===t;
    if(n) return !((h.ticker||'').trim()) && (h.name||'').trim().toLowerCase()===n;
    return false;
  }) || null;
}

function saveFundFromModal(){
  const plan = currentPlan();
  const overlayEl = document.getElementById('fund-modal-overlay');
  const inputs = overlayEl.querySelectorAll('[data-field]');
  const data = {};
  inputs.forEach(inp=>{
    const key = inp.dataset.field;
    const isNumeric = FIELD_META[key] !== undefined;
    data[key] = isNumeric ? (inp.value===''?null:Number(inp.value)) : inp.value;
  });
  if(!data.ticker && !data.name){ alert('Enter at least a ticker or a fund name.'); return; }

  const excludeId = ui.isNew ? null : ui.modalFund;
  const dup = findDuplicateHolding(plan, data.ticker, data.name, excludeId);
  if(dup){
    const proceed = confirm(`"${data.ticker || data.name}" already exists in this plan as "${dup.ticker || dup.name} — ${dup.name}". Save anyway as a duplicate?`);
    if(!proceed) return;
  }

  if(ui.isNew){
    const newHolding = Object.assign({ id: uid(), history: [] }, data);
    plan.holdings.push(newHolding);
  }else{
    const h = plan.holdings.find(x=>x.id===ui.modalFund);
    if(ui.replaceMode){
      h.history = [];
      data.notes = ((data.notes||'').trim() + ` [Replaced ${ui.replaceOldTicker||'previous fund'} on ${todayStr()}]`).trim();
    }
    Object.assign(h, data);
  }
  autoTagTdfHoldings(plan);
  ui.modalFund = null; ui.isNew = false; ui.replaceMode = false; ui.replaceOldTicker = null;
  saveState(); render();
}

function handleCsvImport(e){
  const plan = currentPlan();
  const file = e.target.files[0];
  if(!file) return;
  Papa.parse(file, {
    header:true, skipEmptyLines:true, dynamicTyping:true,
    complete: (results)=>{
      const seenTickers = new Set(plan.holdings.map(h=>(h.ticker||'').trim().toUpperCase()).filter(Boolean));
      const seenNames = new Set(plan.holdings.filter(h=>!(h.ticker||'').trim()).map(h=>(h.name||'').trim().toLowerCase()).filter(Boolean));
      // Recordkeepers all name these columns differently — accept common aliases instead of
      // requiring an exact "ticker"/"name"/"planAssetsHeld" header match.
      const tickerAliases = ['ticker','symbol','fund symbol','fund ticker'];
      const nameAliases = ['name','investment','fund name','investment name'];
      const amountAliases = ['planassetsheld','balance','ending balance','market value','value','amount','assets','aum'];
      const findKey = (row, candidatesInPriorityOrder) => {
        const lower = {}; Object.keys(row).forEach(k=>{ lower[k.trim().toLowerCase()] = k; });
        for(const c of candidatesInPriorityOrder){ if(lower[c]) return lower[c]; }
        return undefined;
      };
      const cleanNumber = (v)=>{ if(v==null||v==='') return null; const n = Number(String(v).replace(/[$,]/g,'').trim()); return isNaN(n)?null:n; };
      const rows = [];
      const skipped = [];
      results.data.forEach(r=>{
        const tKey = findKey(r, tickerAliases) || 'ticker';
        const nKey = findKey(r, nameAliases) || 'name';
        const aKey = findKey(r, amountAliases);
        const rTicker = r[tKey], rName = r[nKey];
        if(!rTicker && !rName) return; // need at least a name (cash/MMDA rows often have no ticker)
        const tk = String(rTicker||'').trim();
        const tkUpper = tk.toUpperCase();
        const nameLower = String(rName||'').trim().toLowerCase();
        if(tkUpper && seenTickers.has(tkUpper)){ skipped.push(tk); return; }
        if(!tkUpper && nameLower && seenNames.has(nameLower)){ skipped.push(rName); return; }
        if(tkUpper) seenTickers.add(tkUpper); else if(nameLower) seenNames.add(nameLower);
        rows.push({
          ticker: tk, name: rName||'', category: r.category||'', assetClass:r.assetClass||'', shareClass:r.shareClass||'',
          aum: r.aum ?? null, expenseRatio: r.expenseRatio ?? null, managerTenure: r.managerTenure ?? null,
          alpha3y: r.alpha3y ?? null, sharpe3y: r.sharpe3y ?? null, stdDev3y: r.stdDev3y ?? null,
          rSquared3y: r.rSquared3y ?? null, upCapture3y: r.upCapture3y ?? null, downCapture3y: r.downCapture3y ?? null,
          return3y: r.return3y ?? null, return5y: r.return5y ?? null,
          benchmarkIndex: r.benchmarkIndex||'', benchmarkReturn3y: r.benchmarkReturn3y ?? null,
          revenueSharingBps: r.revenueSharingBps ?? null, notes: r.notes||'',
          tdfSeries: r.tdfSeries||'', tdfVintageYear: r.tdfVintageYear ?? null,
          tdfGlidePathType: r.tdfGlidePathType||'to', equityAllocation: r.equityAllocation ?? null,
          planAssetsHeld: aKey ? cleanNumber(r[aKey]) : (r.planAssetsHeld ?? null),
        });
      });
      ui.importPreview = { rows, skipped };
      render();
    },
    error: ()=> alert('Could not parse that CSV. Check the column headers and try again.')
  });
  e.target.value = '';
}

function confirmImportPreview(){
  const plan = currentPlan();
  if(!ui.importPreview) return;
  ui.importPreview.rows.forEach(data=>{
    plan.holdings.push(Object.assign({ id: uid(), history: [] }, data));
  });
  const count = ui.importPreview.rows.length;
  autoTagTdfHoldings(plan);
  const enriched = pullPlanFromLibrary(plan); // auto-fill from Fund Library for any matching tickers
  ui.importPreview = null;
  saveState(); render();
  alert(count + ' fund(s) imported.' + (enriched>0 ? ' '+enriched+' auto-filled from the Fund Library.' : ''));
}

loadState();
</script>
