<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiduciary Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --ink:#14213D;
    --ink-soft:#5B6472;
    --paper:#F5F3EE;
    --paper-raised:#FFFFFF;
    --line:#E1DDD1;
    --line-strong:#C9C4B4;
    --forest:#2F5233;
    --forest-soft:#E7EEE6;
    --amber:#9C6B18;
    --amber-soft:#F3EAD6;
    --brick:#8C2F2F;
    --brick-soft:#F3E2DF;
    --slate:#33506B;
    --slate-soft:#E7EDF1;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', 'SF Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px; flex-shrink:0;
    background:var(--ink);
    color:#EDEEF2;
    padding:28px 20px;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    font-family:var(--serif); font-size:20px; font-weight:600;
    letter-spacing:0.01em; line-height:1.25; margin-bottom:2px;
  }
  .brand-sub{
    font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:#8A93A8; margin-bottom:36px; font-weight:500;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; margin-bottom:4px; border-radius:3px;
    font-size:13.5px; font-weight:500; cursor:pointer;
    color:#C4C9D6; transition:background .12s, color .12s;
    border-left:2px solid transparent;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .nav-item.active{ background:rgba(255,255,255,0.09); color:#fff; border-left:2px solid #C9A25C; }
  .nav-count{
    margin-left:auto; font-family:var(--mono); font-size:10.5px;
    color:#8A93A8; background:rgba(255,255,255,0.08); padding:1px 6px; border-radius:8px;
  }
  .sidebar-foot{
    margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1);
    font-size:11px; color:#7E869B; line-height:1.6;
  }

  /* ---------- Main ---------- */
  .main{ flex:1; padding:36px 44px; max-width:1180px; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:14px;}
  .page-title{ font-family:var(--serif); font-size:27px; font-weight:600; margin:0 0 4px; }
  .page-desc{ color:var(--ink-soft); font-size:13.5px; max-width:560px; }
  .btn{
    font-family:var(--sans); font-size:12.5px; font-weight:600; cursor:pointer;
    padding:9px 16px; border-radius:3px; border:1px solid var(--line-strong);
    background:var(--paper-raised); color:var(--ink); transition:all .12s;
  }
  .btn:hover{ border-color:var(--ink); }
  .btn-primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .btn-primary:hover{ background:#233258; }
  .btn-ghost{ border-color:transparent; background:none; }
  .btn-ghost:hover{ background:var(--slate-soft); border-color:transparent; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn-sm{ padding:6px 11px; font-size:11.5px; }
  input[type=file]{ display:none; }

  /* ---------- Table ---------- */
  .table-wrap{ background:var(--paper-raised); border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--ink-soft); font-weight:600; padding:11px 14px; border-bottom:1px solid var(--line);
    background:#FAF9F5; white-space:nowrap;
  }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; transition:background .1s; }
  tbody tr:hover{ background:#FAF9F4; }
  .fund-name{ font-weight:600; font-size:13px; }
  .fund-cat{ color:var(--ink-soft); font-size:11px; }
  .mono{ font-family:var(--mono); }
  .num{ text-align:right; font-family:var(--mono); }

  .status-pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px;
    border-radius:20px; font-size:10.5px; font-weight:600; letter-spacing:.02em;
  }
  .status-pill::before{ content:''; width:6px; height:6px; border-radius:50%; }
  .status-green{ background:var(--forest-soft); color:var(--forest); }
  .status-green::before{ background:var(--forest); }
  .status-yellow{ background:var(--amber-soft); color:var(--amber); }
  .status-yellow::before{ background:var(--amber); }
  .status-red{ background:var(--brick-soft); color:var(--brick); }
  .status-red::before{ background:var(--brick); }

  .history-strip{ display:flex; gap:3px; }
  .history-dot{ width:9px; height:9px; border-radius:2px; }
  .history-dot.g{ background:var(--forest); }
  .history-dot.y{ background:var(--amber); }
  .history-dot.r{ background:var(--brick); }
  .history-dot.empty{ background:var(--line); }

  .empty-state{ padding:70px 30px; text-align:center; color:var(--ink-soft); }
  .empty-state h3{ font-family:var(--serif); color:var(--ink); font-size:18px; margin-bottom:6px; }
  .empty-state p{ font-size:13px; max-width:380px; margin:0 auto 18px; line-height:1.6; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,33,61,0.42);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .modal{
    background:var(--paper-raised); width:100%; max-width:760px; max-height:88vh; overflow-y:auto;
    border-radius:6px; box-shadow:0 20px 60px rgba(20,33,61,0.3);
  }
  .modal-head{ padding:22px 26px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; }
  .modal-body{ padding:24px 26px; }
  .modal-close{ cursor:pointer; color:var(--ink-soft); font-size:20px; line-height:1; background:none; border:none; padding:2px; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .field-grid.cols3{ grid-template-columns:1fr 1fr 1fr; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }
  .field input, .field select{
    font-family:var(--sans); font-size:13px; padding:8px 10px; border:1px solid var(--line-strong);
    border-radius:3px; background:var(--paper); color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--slate); }
  .field-note{ font-size:10.5px; color:var(--ink-soft); }
  .section-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    color:var(--slate); margin:22px 0 12px; padding-top:18px; border-top:1px solid var(--line);
  }
  .section-label:first-child{ margin-top:0; padding-top:0; border-top:none; }

  /* ---------- Detail / seal ---------- */
  .detail-top{ display:flex; gap:24px; align-items:center; margin-bottom:22px; }
  .seal-wrap{ flex-shrink:0; text-align:center; }
  .seal-score{ font-family:var(--serif); font-size:9px; }
  .criteria-list{ display:flex; flex-direction:column; gap:0; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .criteria-row{ display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); font-size:12px; background:var(--paper-raised); }
  .criteria-row:last-child{ border-bottom:none; }
  .criteria-row .c-label{ flex:1; font-weight:500; }
  .criteria-row .c-val{ font-family:var(--mono); color:var(--ink-soft); width:70px; text-align:right; }
  .criteria-row .c-pct{ font-family:var(--mono); width:44px; text-align:right; font-weight:600; }
  .bar-track{ width:70px; height:5px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar-fill{ height:100%; }

  .callout{ padding:10px 14px; border-radius:4px; font-size:12px; line-height:1.55; margin-bottom:16px; }
  .callout-red{ background:var(--brick-soft); color:var(--brick); }
  .callout-amber{ background:var(--amber-soft); color:var(--amber); }

  /* ---------- IPS / Criteria page ---------- */
  .ips-row{ display:grid; grid-template-columns:1.6fr 100px 90px 110px 1.4fr; gap:12px; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .ips-row.head{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; }
  .ips-row input, .ips-row select{ font-family:var(--sans); font-size:12px; padding:6px 8px; border:1px solid var(--line-strong); border-radius:3px; width:100%; }
  .weight-total{ margin-top:14px; font-size:12.5px; }
  .weight-total.bad{ color:var(--brick); font-weight:600; }
  .weight-total.ok{ color:var(--forest); font-weight:600; }
  .card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:5px; padding:22px 24px; margin-bottom:18px; }
  .card h3{ font-family:var(--serif); font-size:16px; margin:0 0 4px; }
  .card .card-desc{ color:var(--ink-soft); font-size:12.5px; margin-bottom:16px; }

  /* ---------- Reports page ---------- */
  .report-fund-pick{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .chip{
    padding:6px 12px; border:1px solid var(--line-strong); border-radius:20px; font-size:12px;
    cursor:pointer; background:var(--paper-raised); user-select:none;
  }
  .chip.on{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .report-doc{ background:var(--paper-raised); border:1px solid var(--line); border-radius:5px; padding:0; }
  .report-page{ padding:46px 50px; border-bottom:8px solid var(--paper); }
  .report-page:last-child{ border-bottom:none; }
  .report-letterhead{ display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:18px; margin-bottom:26px; border-bottom:2px solid var(--ink); }
  .report-letterhead .rl-title{ font-family:var(--serif); font-size:22px; font-weight:600; }
  .report-letterhead .rl-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .report-letterhead .rl-meta{ text-align:right; font-size:11px; color:var(--ink-soft); line-height:1.7; }
  .report-fund-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .report-fund-header h2{ font-family:var(--serif); font-size:19px; margin:0 0 2px; }
  .report-fund-header .rf-sub{ color:var(--ink-soft); font-size:12px; }
  .report-summary-line{ font-size:12.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:22px; padding:12px 14px; background:#FAF9F5; border-radius:4px; }
  .report-foot{ margin-top:30px; padding-top:14px; border-top:1px solid var(--line); font-size:10px; color:var(--ink-soft); line-height:1.7; }

  @media print{
    .sidebar, .page-head .btn-row, .no-print{ display:none !important; }
    .main{ padding:0; max-width:none; }
    body{ background:#fff; }
    .report-doc{ border:none; }
    .report-page{ border-bottom:none; page-break-after:always; padding:0; }
  }

  ::placeholder{ color:#A8A296; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   FIDUCIARY MONITOR — investment due-diligence & monitoring workspace
   All data stored locally per-user via window.storage. No external data
   feed is wired up: fund figures are entered manually or via CSV import.
   ========================================================================= */

const STORAGE_KEY = 'fiduciary-monitor-state-v1';

const DEFAULT_CRITERIA = [
  { key:'expenseRatio', label:'Expense Ratio (%)',      direction:'lower',  weight:15, hard:false, hardMax:null },
  { key:'managerTenure', label:'Manager Tenure (yrs)',   direction:'higher', weight:10, hard:true,  hardMin:2 },
  { key:'alpha3y',       label:'3-Yr Alpha',             direction:'higher', weight:15, hard:false },
  { key:'sharpe3y',      label:'3-Yr Sharpe Ratio',      direction:'higher', weight:15, hard:false },
  { key:'stdDev3y',      label:'3-Yr Std. Deviation',    direction:'lower',  weight:5,  hard:false },
  { key:'rSquared3y',    label:'3-Yr R-Squared',         direction:'higher', weight:10, hard:false },
  { key:'upCapture3y',   label:'Up-Market Capture',      direction:'higher', weight:8,  hard:false },
  { key:'downCapture3y', label:'Down-Market Capture',    direction:'lower',  weight:8,  hard:false },
  { key:'return3y',      label:'3-Yr Return',            direction:'higher', weight:7,  hard:false },
  { key:'return5y',      label:'5-Yr Return',            direction:'higher', weight:7,  hard:false },
];

const FIELD_META = {
  expenseRatio:{unit:'%', step:'0.01'}, managerTenure:{unit:'yrs', step:'0.5'},
  alpha3y:{unit:'', step:'0.01'}, sharpe3y:{unit:'', step:'0.01'},
  stdDev3y:{unit:'', step:'0.01'}, rSquared3y:{unit:'', step:'0.1'},
  upCapture3y:{unit:'%', step:'0.1'}, downCapture3y:{unit:'%', step:'0.1'},
  return3y:{unit:'%', step:'0.01'}, return5y:{unit:'%', step:'0.01'},
  aum:{unit:'$M', step:'1'},
};

let state = {
  holdings: [],
  criteria: DEFAULT_CRITERIA,
  greenThreshold: 60,
  yellowThreshold: 40,
  view: 'watchlist',
  reportSelection: [],
};

let ui = { modalFund:null, isNew:false, detailFund:null, importOpen:false, saveTimer:null, saveState:'idle' };

/* ---------------------------- persistence ---------------------------- */
async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign({}, state, parsed);
      if(!state.criteria || !state.criteria.length) state.criteria = DEFAULT_CRITERIA;
    }
  }catch(e){ /* no saved state yet */ }
  render();
}
function saveState(){
  ui.saveState = 'saving'; renderSaveIndicator();
  clearTimeout(ui.saveTimer);
  ui.saveTimer = setTimeout(async ()=>{
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
      ui.saveState = 'saved';
    }catch(e){ ui.saveState = 'error'; }
    renderSaveIndicator();
  }, 400);
}
function renderSaveIndicator(){
  const el = document.getElementById('save-indicator');
  if(!el) return;
  el.textContent = ui.saveState === 'saving' ? 'Saving…' : ui.saveState === 'error' ? 'Save failed (data kept in this session)' : 'Saved to this device';
}

/* ---------------------------- scoring engine --------------------------- */
function percentileRank(value, allValues, direction){
  const vals = allValues.filter(v => typeof v === 'number' && !isNaN(v));
  if(vals.length <= 1) return 50;
  const sorted = [...vals].sort((a,b)=>a-b);
  let below = sorted.filter(v => v < value).length;
  let equal = sorted.filter(v => v === value).length;
  let rank = (below + 0.5*equal) / sorted.length; // 0..1, higher = larger raw value
  if(direction === 'lower') rank = 1 - rank;
  return Math.round(rank * 100);
}

function computeScores(holding, allHoldings, criteria){
  const peers = allHoldings.filter(h => h.category === holding.category);
  const universe = peers.length >= 3 ? peers : allHoldings; // fall back to full universe if peer group is thin
  const breakdown = [];
  let hardFail = null;
  let weightedSum = 0, weightUsed = 0;

  criteria.forEach(c=>{
    const value = holding[c.key];
    if(c.hard && typeof value === 'number'){
      if(c.hardMin !== undefined && c.hardMin !== null && value < c.hardMin){
        hardFail = c.label + ' below IPS minimum (' + value + ' < ' + c.hardMin + ')';
      }
      if(c.hardMax !== undefined && c.hardMax !== null && value > c.hardMax){
        hardFail = c.label + ' above IPS maximum (' + value + ' > ' + c.hardMax + ')';
      }
    }
    if(typeof value !== 'number' || isNaN(value)){
      breakdown.push({ key:c.key, label:c.label, value:null, pct:null, weight:c.weight });
      return;
    }
    const allVals = universe.map(h=>h[c.key]);
    const pct = percentileRank(value, allVals, c.direction);
    breakdown.push({ key:c.key, label:c.label, value, pct, weight:c.weight });
    weightedSum += pct * c.weight;
    weightUsed += c.weight;
  });

  const overall = weightUsed > 0 ? Math.round(weightedSum / weightUsed) : 0;
  let status = 'red';
  if(!hardFail){
    if(overall >= state.greenThreshold) status = 'green';
    else if(overall >= state.yellowThreshold) status = 'yellow';
  }
  return { overall, status, breakdown, hardFail, peerCount: universe.length, usedFullUniverse: peers.length < 3 };
}

/* ------------------------------ helpers -------------------------------- */
function uid(){ return 'f_' + Math.random().toString(36).slice(2,10); }
function fmt(v, unit){
  if(v === null || v === undefined || v === '' || isNaN(v)) return '—';
  return (unit === '%' ? Number(v).toFixed(2)+'%' : unit === '$M' ? '$'+Number(v).toLocaleString()+'M' : Number(v).toFixed(2));
}
function statusLabel(s){ return s==='green'?'Pass':s==='yellow'?'Watch':'Fail'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function scoreColor(pct){
  if(pct===null) return 'var(--line)';
  if(pct>=60) return 'var(--forest)';
  if(pct>=40) return 'var(--amber)';
  return 'var(--brick)';
}

/* ------------------------------ rendering ------------------------------ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderSidebar()}
    <div class="main">
      ${state.view==='watchlist' ? renderWatchlist() : ''}
      ${state.view==='criteria' ? renderCriteria() : ''}
      ${state.view==='reports' ? renderReports() : ''}
    </div>
    ${ui.modalFund !== null ? renderFundModal() : ''}
    ${ui.detailFund !== null ? renderDetailModal() : ''}
  `;
  attachHandlers();
}

function renderSidebar(){
  const n = state.holdings.length;
  const failCount = n ? state.holdings.filter(h=>computeScores(h, state.holdings, state.criteria).status==='red').length : 0;
  return `
  <div class="sidebar">
    <div class="brand">Fiduciary Monitor</div>
    <div class="brand-sub">Due Diligence Workspace</div>
    <div class="nav-item ${state.view==='watchlist'?'active':''}" data-nav="watchlist">Watchlist <span class="nav-count">${n}</span></div>
    <div class="nav-item ${state.view==='criteria'?'active':''}" data-nav="criteria">IPS Criteria</div>
    <div class="nav-item ${state.view==='reports'?'active':''}" data-nav="reports">Reports</div>
    <div class="sidebar-foot">
      ${failCount>0 ? failCount+' holding'+(failCount>1?'s':'')+' flagged Fail<br>' : ''}
      <span id="save-indicator">Saved to this device</span>
    </div>
  </div>`;
}

/* ---- Watchlist ---- */
function renderWatchlist(){
  const rows = state.holdings.map(h=>{
    const s = computeScores(h, state.holdings, state.criteria);
    const hist = (h.history||[]).slice(-8);
    const histDots = Array.from({length:8}).map((_,i)=>{
      const rec = hist[i];
      if(!rec) return '<span class="history-dot empty"></span>';
      const cls = rec.status==='green'?'g':rec.status==='yellow'?'y':'r';
      return `<span class="history-dot ${cls}" title="${rec.date}: ${rec.overall}/100"></span>`;
    }).join('');
    return `
    <tr data-detail="${h.id}">
      <td>
        <div class="fund-name">${escapeHtml(h.ticker)} — ${escapeHtml(h.name)}</div>
        <div class="fund-cat">${escapeHtml(h.category||'Uncategorized')}</div>
      </td>
      <td><span class="status-pill status-${s.status}">${statusLabel(s.status)}</span></td>
      <td class="num">${s.overall}<span style="color:var(--ink-soft)">/100</span></td>
      <td class="num">${fmt(h.expenseRatio,'%')}</td>
      <td class="num">${fmt(h.managerTenure)}</td>
      <td class="num">${fmt(h.sharpe3y)}</td>
      <td><div class="history-strip">${histDots}</div></td>
      <td style="text-align:right"><button class="btn btn-ghost btn-sm" data-edit="${h.id}">Edit</button></td>
    </tr>`;
  }).join('');

  return `
  <div class="page-head">
    <div>
      <h1 class="page-title">Watchlist</h1>
      <p class="page-desc">Score every holding against your IPS criteria, ranked within its category peer group. Run a quarterly review to log a dated scorecard entry for the audit trail.</p>
    </div>
    <div class="btn-row">
      ${state.holdings.length ? `<button class="btn" id="btn-run-review">Run Quarterly Review</button>` : ''}
      <button class="btn" id="btn-import">Import CSV</button>
      <input type="file" id="csv-input" accept=".csv">
      <button class="btn btn-primary" id="btn-add-fund">Add Holding</button>
    </div>
  </div>
  <div class="table-wrap">
    ${state.holdings.length === 0 ? `
      <div class="empty-state">
        <h3>No holdings yet</h3>
        <p>Add a fund manually, or import a CSV with columns: ticker, name, category, expenseRatio, managerTenure, alpha3y, sharpe3y, stdDev3y, rSquared3y, upCapture3y, downCapture3y, return3y, return5y, aum.</p>
        <button class="btn btn-primary" id="btn-add-fund-empty">Add your first holding</button>
      </div>
    ` : `
    <table>
      <thead><tr>
        <th>Holding</th><th>Status</th><th style="text-align:right">Score</th>
        <th style="text-align:right">Exp. Ratio</th><th style="text-align:right">Tenure</th>
        <th style="text-align:right">Sharpe</th><th>History</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`}
  </div>`;
}

/* ---- Fund add/edit modal ---- */
function renderFundModal(){
  const isNew = ui.isNew;
  const h = isNew ? { id:uid(), ticker:'', name:'', category:'', assetClass:'', aum:null,
    expenseRatio:null, managerTenure:null, alpha3y:null, sharpe3y:null, stdDev3y:null,
    rSquared3y:null, upCapture3y:null, downCapture3y:null, return3y:null, return5y:null, notes:'', history:[] }
    : state.holdings.find(x=>x.id===ui.modalFund);

  const numField = (key,label) => {
    const meta = FIELD_META[key]||{};
    return `<div class="field"><label>${label}${meta.unit?' ('+meta.unit+')':''}</label>
      <input type="number" step="${meta.step||'any'}" data-field="${key}" value="${h[key]??''}"></div>`;
  };

  return `
  <div class="overlay" id="fund-modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div style="font-family:var(--serif);font-size:19px;font-weight:600;">${isNew?'Add Holding':'Edit Holding'}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">Enter figures as reported (e.g. expense ratio 0.65 = 0.65%).</div>
        </div>
        <button class="modal-close" id="close-fund-modal">×</button>
      </div>
      <div class="modal-body">
        <div class="section-label">Identification</div>
        <div class="field-grid cols3">
          <div class="field"><label>Ticker</label><input data-field="ticker" value="${escapeHtml(h.ticker)}" placeholder="VTSAX"></div>
          <div class="field"><label>Name</label><input data-field="name" value="${escapeHtml(h.name)}" placeholder="Vanguard Total Stock Market"></div>
          <div class="field"><label>Category / Peer Group</label><input data-field="category" value="${escapeHtml(h.category)}" placeholder="Large Blend"></div>
        </div>
        <div class="field-grid cols3" style="margin-top:14px;">
          <div class="field"><label>Asset Class</label><input data-field="assetClass" value="${escapeHtml(h.assetClass)}" placeholder="US Equity"></div>
          ${numField('aum','AUM')}
          ${numField('managerTenure','Manager Tenure')}
        </div>

        <div class="section-label">Cost &amp; Risk-Adjusted Performance</div>
        <div class="field-grid cols3">
          ${numField('expenseRatio','Expense Ratio')}
          ${numField('alpha3y','3-Yr Alpha')}
          ${numField('sharpe3y','3-Yr Sharpe Ratio')}
          ${numField('stdDev3y','3-Yr Std. Deviation')}
          ${numField('rSquared3y','3-Yr R-Squared')}
        </div>

        <div class="section-label">Capture Ratios &amp; Returns</div>
        <div class="field-grid cols3">
          ${numField('upCapture3y','Up-Market Capture')}
          ${numField('downCapture3y','Down-Market Capture')}
          ${numField('return3y','3-Yr Return')}
          ${numField('return5y','5-Yr Return')}
        </div>

        <div class="section-label">Notes</div>
        <div class="field">
          <textarea data-field="notes" rows="3" style="font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);resize:vertical;">${escapeHtml(h.notes||'')}</textarea>
        </div>

        <div class="btn-row" style="margin-top:24px; justify-content:space-between;">
          <div>${!isNew ? `<button class="btn" id="btn-delete-fund" style="color:var(--brick);border-color:var(--brick-soft);">Remove Holding</button>` : '<span></span>'}</div>
          <div class="btn-row">
            <button class="btn" id="cancel-fund-modal">Cancel</button>
            <button class="btn btn-primary" id="save-fund-modal" data-id="${h.id}">Save Holding</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---- Fund detail / seal ---- */
function renderSeal(overall, status){
  const color = status==='green'?'var(--forest)':status==='yellow'?'var(--amber)':'var(--brick)';
  const r = 46, c = 2*Math.PI*r;
  const pct = Math.max(0,Math.min(100,overall))/100;
  const dash = c*pct;
  return `
  <svg width="116" height="116" viewBox="0 0 116 116">
    <circle cx="58" cy="58" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/>
    <circle cx="58" cy="58" r="${r}" fill="none" stroke="${color}" stroke-width="7"
      stroke-dasharray="${dash} ${c}" stroke-linecap="round" transform="rotate(-90 58 58)"/>
    <text x="58" y="54" text-anchor="middle" font-family="'Source Serif 4',serif" font-size="26" font-weight="600" fill="var(--ink)">${overall}</text>
    <text x="58" y="70" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" letter-spacing="1" fill="var(--ink-soft)">SCORE /100</text>
  </svg>`;
}

function renderDetailModal(){
  const h = state.holdings.find(x=>x.id===ui.detailFund);
  if(!h) return '';
  const s = computeScores(h, state.holdings, state.criteria);
  const rows = s.breakdown.map(b=>{
    const meta = FIELD_META[b.key]||{};
    return `<div class="criteria-row">
      <div class="c-label">${escapeHtml(b.label)}</div>
      <div class="c-val">${fmt(b.value, meta.unit)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${b.pct??0}%; background:${scoreColor(b.pct)}"></div></div>
      <div class="c-pct">${b.pct===null?'—':b.pct}</div>
    </div>`;
  }).join('');

  const histRows = (h.history||[]).slice().reverse().map(r=>`
    <div class="criteria-row"><div class="c-label">${r.date}</div>
      <div class="c-val" style="width:auto;flex:1;text-align:left;">
        <span class="status-pill status-${r.status}">${statusLabel(r.status)}</span>
      </div>
      <div class="c-pct">${r.overall}</div>
    </div>`).join('') || `<div style="padding:14px;color:var(--ink-soft);font-size:12px;">No quarterly reviews logged yet. Use "Run Quarterly Review" from the watchlist to start the audit trail.</div>`;

  return `
  <div class="overlay" id="detail-modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div style="font-family:var(--serif);font-size:19px;font-weight:600;">${escapeHtml(h.ticker)} — ${escapeHtml(h.name)}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${escapeHtml(h.category||'Uncategorized')} · scored against ${s.peerCount} ${s.usedFullUniverse?'holding(s) (full universe — thin peer group)':'peer(s) in category'}</div>
        </div>
        <button class="modal-close" id="close-detail-modal">×</button>
      </div>
      <div class="modal-body">
        ${s.hardFail ? `<div class="callout callout-red"><strong>IPS hard-criterion failure:</strong> ${escapeHtml(s.hardFail)}</div>` : ''}
        <div class="detail-top">
          <div class="seal-wrap">${renderSeal(s.overall, s.status)}</div>
          <div style="flex:1;">
            <span class="status-pill status-${s.status}" style="font-size:12px;padding:5px 12px 5px 9px;">${statusLabel(s.status)}</span>
            <p style="font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin-top:10px;">
              Composite score is the weight-adjusted average of this holding's percentile rank on each IPS criterion,
              measured against its category peer group. ${h.notes ? '<br><br><strong>Notes:</strong> '+escapeHtml(h.notes) : ''}
            </p>
          </div>
        </div>
        <div class="section-label">Criteria Breakdown</div>
        <div class="criteria-list">${rows}</div>
        <div class="section-label">Review History</div>
        <div class="criteria-list">${histRows}</div>
      </div>
    </div>
  </div>`;
}

/* ---- IPS Criteria page ---- */
function renderCriteria(){
  const totalWeight = state.criteria.reduce((s,c)=>s+Number(c.weight||0),0);
  const rows = state.criteria.map((c,i)=>`
    <div class="ips-row">
      <input data-crit="label" data-idx="${i}" value="${escapeHtml(c.label)}">
      <select data-crit="direction" data-idx="${i}">
        <option value="higher" ${c.direction==='higher'?'selected':''}>Higher = better</option>
        <option value="lower" ${c.direction==='lower'?'selected':''}>Lower = better</option>
      </select>
      <input type="number" data-crit="weight" data-idx="${i}" value="${c.weight}" min="0" max="100">
      <label style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);">
        <input type="checkbox" data-crit="hard" data-idx="${i}" ${c.hard?'checked':''} style="width:auto;"> Hard min ${c.direction==='higher' && c.hard ? '('+(c.hardMin??'—')+')' : ''}
      </label>
      <button class="btn btn-ghost btn-sm" data-remove-crit="${i}" style="justify-self:end;color:var(--brick);">Remove</button>
    </div>`).join('');

  return `
  <div class="page-head">
    <div>
      <h1 class="page-title">IPS Criteria</h1>
      <p class="page-desc">Define the factors your Investment Policy Statement evaluates and how each is weighted. Weights should sum to 100. A "hard minimum" flag forces a Fail status regardless of composite score.</p>
    </div>
  </div>

  <div class="card">
    <h3>Scoring Criteria</h3>
    <div class="card-desc">Percentile scoring is relative to each holding's category peer group.</div>
    <div class="ips-row head">
      <div>Criterion</div><div>Direction</div><div>Weight %</div><div>Hard rule</div><div></div>
    </div>
    ${rows}
    <div class="weight-total ${totalWeight===100?'ok':'bad'}">Total weight: ${totalWeight}% ${totalWeight===100?'✓ balanced':'— should equal 100%'}</div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-sm" id="btn-add-criterion">Add Criterion</button>
      <button class="btn btn-sm" id="btn-reset-criteria">Reset to Default Set</button>
    </div>
  </div>

  <div class="card">
    <h3>Status Thresholds</h3>
    <div class="card-desc">Composite score bands that determine Pass / Watch / Fail.</div>
    <div class="field-grid" style="max-width:420px;">
      <div class="field"><label>Green (Pass) minimum score</label><input type="number" id="green-threshold" value="${state.greenThreshold}" min="0" max="100"></div>
      <div class="field"><label>Yellow (Watch) minimum score</label><input type="number" id="yellow-threshold" value="${state.yellowThreshold}" min="0" max="100"></div>
    </div>
    <div class="field-note" style="margin-top:10px;">Below the Watch threshold — or any hard-minimum failure — is scored Fail.</div>
  </div>`;
}

/* ---- Reports page ---- */
function renderReports(){
  if(state.holdings.length===0){
    return `<div class="page-head"><div><h1 class="page-title">Reports</h1><p class="page-desc">Add holdings to the watchlist first.</p></div></div>`;
  }
  const chips = state.holdings.map(h=>`
    <div class="chip ${state.reportSelection.includes(h.id)?'on':''}" data-chip="${h.id}">${escapeHtml(h.ticker)}</div>
  `).join('');

  const selected = state.holdings.filter(h=>state.reportSelection.includes(h.id));
  const genDate = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

  const pages = selected.map(h=>{
    const s = computeScores(h, state.holdings, state.criteria);
    const rows = s.breakdown.map(b=>{
      const meta = FIELD_META[b.key]||{};
      return `<div class="criteria-row"><div class="c-label">${escapeHtml(b.label)}</div>
        <div class="c-val">${fmt(b.value, meta.unit)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${b.pct??0}%;background:${scoreColor(b.pct)}"></div></div>
        <div class="c-pct">${b.pct===null?'—':b.pct}</div></div>`;
    }).join('');
    return `
    <div class="report-page">
      <div class="report-fund-header">
        <div>
          <h2>${escapeHtml(h.ticker)} — ${escapeHtml(h.name)}</h2>
          <div class="rf-sub">${escapeHtml(h.category||'Uncategorized')} · Reviewed ${genDate}</div>
        </div>
        <div>${renderSeal(s.overall, s.status)}</div>
      </div>
      ${s.hardFail ? `<div class="callout callout-red"><strong>IPS hard-criterion failure:</strong> ${escapeHtml(s.hardFail)}</div>` : ''}
      <div class="report-summary-line">
        <strong>Status: ${statusLabel(s.status)}.</strong> Composite score of ${s.overall}/100, weight-adjusted across ${s.breakdown.length} IPS criteria
        and ranked against ${s.peerCount} holding(s) in the ${s.usedFullUniverse ? 'full watchlist universe (peer group had fewer than 3 members)' : 'category peer group'}.
      </div>
      <div class="criteria-list">${rows}</div>
      <div class="report-foot">Prepared for internal fiduciary review. Percentile scores are relative to the peer set defined above, not to the broader fund universe, and reflect data entered by the reviewer as of the date above. This report does not constitute investment advice.</div>
    </div>`;
  }).join('');

  return `
  <div class="page-head">
    <div>
      <h1 class="page-title">Reports</h1>
      <p class="page-desc">Select holdings to include, then print or save as PDF using your browser's print dialog.</p>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-print-report" ${selected.length===0?'disabled':''}>Print / Save PDF</button>
    </div>
  </div>
  <div class="report-fund-pick no-print">${chips}</div>
  ${selected.length===0 ? `<div class="table-wrap"><div class="empty-state"><h3>Select holdings above</h3><p>Choose one or more funds to generate a due-diligence report.</p></div></div>` : `
  <div class="report-doc">
    <div class="report-page" style="border-bottom:none;padding-bottom:0;">
      <div class="report-letterhead">
        <div>
          <div class="rl-title">Investment Due Diligence Report</div>
          <div class="rl-sub">Fiduciary Monitor — Quarterly Watchlist Review</div>
        </div>
        <div class="rl-meta">Prepared ${genDate}<br>${selected.length} holding${selected.length>1?'s':''} reviewed</div>
      </div>
    </div>
    ${pages}
  </div>`}
  `;
}

/* ------------------------------ handlers -------------------------------- */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ state.view = el.dataset.nav; render(); };
  });

  // Watchlist
  const addBtn = document.getElementById('btn-add-fund') || document.getElementById('btn-add-fund-empty');
  if(addBtn) addBtn.onclick = ()=>{ ui.isNew = true; ui.modalFund = 'new'; render(); };
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); ui.isNew=false; ui.modalFund = el.dataset.edit; render(); };
  });
  document.querySelectorAll('[data-detail]').forEach(el=>{
    el.onclick = ()=>{ ui.detailFund = el.dataset.detail; render(); };
  });
  const runReview = document.getElementById('btn-run-review');
  if(runReview) runReview.onclick = ()=>{
    const date = todayStr();
    state.holdings.forEach(h=>{
      const s = computeScores(h, state.holdings, state.criteria);
      h.history = h.history || [];
      h.history.push({ date, overall:s.overall, status:s.status });
    });
    saveState(); render();
  };
  const importBtn = document.getElementById('btn-import');
  if(importBtn) importBtn.onclick = ()=> document.getElementById('csv-input').click();
  const csvInput = document.getElementById('csv-input');
  if(csvInput) csvInput.onchange = handleCsvImport;

  // Fund modal
  const overlay = document.getElementById('fund-modal-overlay');
  if(overlay) overlay.onclick = (e)=>{ if(e.target.id==='fund-modal-overlay') closeFundModal(); };
  const closeBtn = document.getElementById('close-fund-modal');
  if(closeBtn) closeBtn.onclick = closeFundModal;
  const cancelBtn = document.getElementById('cancel-fund-modal');
  if(cancelBtn) cancelBtn.onclick = closeFundModal;
  const saveBtn = document.getElementById('save-fund-modal');
  if(saveBtn) saveBtn.onclick = saveFundFromModal;
  const delBtn = document.getElementById('btn-delete-fund');
  if(delBtn) delBtn.onclick = ()=>{
    state.holdings = state.holdings.filter(h=>h.id!==ui.modalFund);
    ui.modalFund = null; saveState(); render();
  };

  // Detail modal
  const dOverlay = document.getElementById('detail-modal-overlay');
  if(dOverlay) dOverlay.onclick = (e)=>{ if(e.target.id==='detail-modal-overlay'){ ui.detailFund=null; render(); } };
  const dClose = document.getElementById('close-detail-modal');
  if(dClose) dClose.onclick = ()=>{ ui.detailFund=null; render(); };

  // Criteria page
  document.querySelectorAll('[data-crit]').forEach(el=>{
    el.onchange = ()=>{
      const idx = Number(el.dataset.idx);
      const field = el.dataset.crit;
      if(field==='hard') state.criteria[idx].hard = el.checked;
      else if(field==='weight') state.criteria[idx].weight = Number(el.value)||0;
      else state.criteria[idx][field] = el.value;
      if(field==='hard' && el.checked && state.criteria[idx].hardMin==null) state.criteria[idx].hardMin = 0;
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-remove-crit]').forEach(el=>{
    el.onclick = ()=>{ state.criteria.splice(Number(el.dataset.removeCrit),1); saveState(); render(); };
  });
  const addCrit = document.getElementById('btn-add-criterion');
  if(addCrit) addCrit.onclick = ()=>{
    state.criteria.push({ key:'custom_'+uid(), label:'New Criterion', direction:'higher', weight:0, hard:false });
    saveState(); render();
  };
  const resetCrit = document.getElementById('btn-reset-criteria');
  if(resetCrit) resetCrit.onclick = ()=>{
    if(confirm('Reset all criteria to the default IPS set? This will not affect stored fund data.')){
      state.criteria = JSON.parse(JSON.stringify(DEFAULT_CRITERIA)); saveState(); render();
    }
  };
  const gT = document.getElementById('green-threshold');
  if(gT) gT.onchange = ()=>{ state.greenThreshold = Number(gT.value); saveState(); render(); };
  const yT = document.getElementById('yellow-threshold');
  if(yT) yT.onchange = ()=>{ state.yellowThreshold = Number(yT.value); saveState(); render(); };

  // Reports page
  document.querySelectorAll('[data-chip]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.chip;
      const i = state.reportSelection.indexOf(id);
      if(i>-1) state.reportSelection.splice(i,1); else state.reportSelection.push(id);
      saveState(); render();
    };
  });
  const printBtn = document.getElementById('btn-print-report');
  if(printBtn) printBtn.onclick = ()=> window.print();
}

function closeFundModal(){ ui.modalFund = null; render(); }

function saveFundFromModal(){
  const overlayEl = document.getElementById('fund-modal-overlay');
  const inputs = overlayEl.querySelectorAll('[data-field]');
  const data = {};
  inputs.forEach(inp=>{
    const key = inp.dataset.field;
    const isNumeric = FIELD_META[key] !== undefined;
    data[key] = isNumeric ? (inp.value===''?null:Number(inp.value)) : inp.value;
  });
  if(!data.ticker){ alert('Ticker is required.'); return; }

  if(ui.isNew){
    const newHolding = Object.assign({ id: uid(), history: [] }, data);
    state.holdings.push(newHolding);
  }else{
    const h = state.holdings.find(x=>x.id===ui.modalFund);
    Object.assign(h, data);
  }
  ui.modalFund = null; ui.isNew = false;
  saveState(); render();
}

function handleCsvImport(e){
  const file = e.target.files[0];
  if(!file) return;
  Papa.parse(file, {
    header:true, skipEmptyLines:true, dynamicTyping:true,
    complete: (results)=>{
      const rows = results.data;
      let added = 0;
      rows.forEach(r=>{
        if(!r.ticker) return;
        const h = { id:uid(), history:[],
          ticker:String(r.ticker).trim(), name:r.name||'', category:r.category||'', assetClass:r.assetClass||'',
          aum: r.aum ?? null, expenseRatio: r.expenseRatio ?? null, managerTenure: r.managerTenure ?? null,
          alpha3y: r.alpha3y ?? null, sharpe3y: r.sharpe3y ?? null, stdDev3y: r.stdDev3y ?? null,
          rSquared3y: r.rSquared3y ?? null, upCapture3y: r.upCapture3y ?? null, downCapture3y: r.downCapture3y ?? null,
          return3y: r.return3y ?? null, return5y: r.return5y ?? null, notes: r.notes||''
        };
        state.holdings.push(h); added++;
      });
      saveState(); render();
      alert(added + ' holding(s) imported.');
    },
    error: ()=> alert('Could not parse that CSV. Check the column headers and try again.')
  });
  e.target.value = '';
}

loadState();
</script>
</body>
</html>
